privacy:
  info: "&6Что Allay хранит о тебе на этом сервере\n&7• В зашифрованном виде, на бэкенде Allay: твой разговор — 30 дней после последнего вопроса; то, что он о тебе запомнил (&f/allay memory&7), вместе с местами, а ещё твои настройки, часовой пояс, цели и смерти — пока ты их не сотрёшь или год после последнего вопроса; записи твоих вопросов — 30 дней, чтобы находить и исправлять ошибки. Оператор бэкенда открывает запись, только чтобы разобраться с проблемой, и каждый такой просмотр записывается.\n&7• Без шифрования: твой ник, UUID и статус оператора для панели администратора (если не включена полная приватность), цифры по твоим вопросам (когда, модель, стоимость) и твоё согласие — 2 года.\n&7• Зашифрованные бэкапы всего этого — до 12 месяцев.\n&7• Каждый вопрос идёт через OpenRouter в США к ИИ-провайдеру, который пишет ответ.\n&7Другие серверы ничего из этого не видят."
  commands: "&f/allay privacy full on|off &7— полная приватность: панель администратора видит псевдоним вместо ника\n&f/allay privacy export &7— ссылка на всё, что Allay хранит о тебе, на 24 часа\n&f/allay privacy withdraw &7— отозвать согласие; Allay перестанет тебе отвечать\n&f/allay privacy erase &7— стереть всё, что Allay хранит о тебе здесь"
  admin: "&8Админам: &f/allay privacy export <игрок> &8даст ссылку на данные игрока, чтобы передать ему, &f/allay privacy erase <игрок> &8сотрёт их."
  erase_confirm: "&eСтереть всё, что Allay хранит о тебе на этом сервере? Память, разговор и ветки твоих агентов пропадут насовсем, а вопросы останутся только обезличенными числами."
  erase_hover: "&7Отменить не получится"
  erased_self: "&aГотово: Allay забыл тебя на этом сервере, включая {memories} {memories|факт|факта|фактов}."
  export_ready: "&aТвои данные можно скачать до {until}. Открыть их может любой, у кого есть ссылка, так что никому её не давай:"
  export_ready_for: "&aСсылка на то, что Allay хранит об игроке {player}, работает до {until}. Это личные данные: отдай её только ему:"
  export_button: "&9[Скачать]"
