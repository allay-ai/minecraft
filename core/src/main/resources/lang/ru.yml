  erased: "&aСтёрто всё, что Allay хранил об игроке {player}: {memories} {memories|факт|факта|фактов}; {runs} {runs|вопрос|вопроса|вопросов} теперь ничьи."
  unknown_player: "&cЭтот сервер не видел игрока {player}. Укажи его UUID."
  unsupported: "&7Этот бэкенд Allay старше 6.0 и не умеет выгружать или стирать данные игрока."
  usage: "&7Использование: &f/allay privacy &7[agree|withdraw|full|export|erase]; админам: &f/allay privacy export|erase <игрок|uuid>"
  full_on: "&aПолная приватность включена: панель администратора бэкенда Allay видит псевдоним вместо твоего ника, UUID и скина. Что ты мне рассказал, я помню."
