# Тексты Allay на русском. Каждый игрок читает файл своего языка; ключа, которого здесь
# нет, плагин возьмёт из locales.default, а затем из английского. Пустой текст ("")
# выключает сообщение. Цвета — коды & (&a, &7, &f…). Подстановки выглядят как {name},
# множественное число — как {count|стак|стака|стаков}: форму выбирает число из {count}.
# С PlaceholderAPI {papi:name} показывает %name% для игрока, о котором сообщение.

status:
  # Живая строка над хотбаром, пока ассистент работает, как у Claude Code:
  # спиннер, меняющийся глагол, секунды, сколько токенов прочитано (↑) и написано (↓).
  line: "&6{spinner} &6{verb}… &7({seconds}с · ↑ {input} · ↓ {output} {tokens|токен|токена|токенов})"
  answering: "Пишу ответ"
  verbs:
    - "Листаю книгу рецептов"
    - "Переплавляю мысли в печи"
    - "Зачаровываю ответ"
    - "Варю зелье мудрости"
    - "Советуюсь с библиотекарем"
    - "Сверяюсь с картой"
    - "Тяну редстоун"
    - "Напеваю мелодию"
    - "Кружу у нотного блока"
    - "Точу кирку"
    - "Копаю на Y −59"
    - "Ищу что-нибудь блестящее"
    - "Перебираю сундуки"
    - "Порхаю над сундуками"
    - "Несу нужный предмет"
    - "Крадусь мимо Хранителя"
    - "Спорю с крипером"
    - "Танцую под проигрыватель"
  askx_verbs:
    - "Настраиваю командный блок"
    - "Подбираю селектор @s"
    - "Сверяю синтаксис"
    - "Кручу компаратор"

tool_lines:
  # Строка в чате, когда ассистент пользуется инструментом, и результат под ней.
  started: "&7⏺ {label}"
  finished: "&8  ⎿ {summary}"
  # Причина ({reason}) написана для ассистента по-английски, поэтому здесь её нет.
  failed: "&c  ⎿ не вышло"
  unknown: "Пользуюсь {name}"

