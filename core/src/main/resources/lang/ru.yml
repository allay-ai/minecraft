consent:
  notice: "&6Прежде чем Allay ответит\n&7Allay — ИИ-помощник. Чтобы ответить, он отправляет на свой бэкенд твой вопрос, ник и UUID, язык и то, что читает для тебя в игре: инвентарь, окрестности, координаты."
  hosted: "&7За Allay здесь отвечает владелец {server}; бэкенд Allay для него работает на allay.chat, на серверах в Хельсинки (Финляндия), по GDPR и испанскому LOPDGDD, с зашифрованными бэкапами в Cloudflare. Каждый вопрос идёт через OpenRouter в США к ИИ-провайдеру, который пишет ответ."
  self: "&7Владелец {server} держит свой бэкенд Allay и хранит твои данные. Каждый вопрос идёт к ИИ-провайдеру, которого выбрал сервер."
  keeps: "&7В зашифрованном виде: разговор — 30 дней, память, места, смерти, настройки и цели — год после твоего последнего вопроса, записи вопросов — 30 дней. Как есть: ник, UUID, твоё согласие и цифры по вопросам — 2 года. Бэкапы — до 12 месяцев. Ответы пишет ИИ, и он может ошибаться. &f/allay privacy&7 покажет, выгрузит и сотрёт это, а &f/allay privacy withdraw&7 отзовёт согласие и сотрёт то, что оно покрывало."
  title: "Allay и твои данные"
  agree: "&aДаю согласие"
  agree_hover: "&7Allay сразу ответит на твой вопрос"
  decline: "&cНет, спасибо"
  decline_hover: "&7Allay не будет отвечать тебе и ничего о тебе не отправит"
  policy: "Политика конфиденциальности"
  policy_hover: "&7{url}"
  given: "&aСпасибо! Allay уже отвечает."
  given_idle: "&aСпасибо! Спрашивай через &f/ask&a."
  already: "&7Ты уже дал согласие. &f/allay privacy&7 покажет, что Allay о тебе хранит."
  reopen: "&7Прежде чем ответить, Allay спрашивает тебя в окне."
  reopen_button: "&f[Открыть снова]"
  reopen_hover: "&7Откроет окно ещё раз"
  declined: "&7Хорошо: Allay не будет тебе отвечать, и ничего о тебе не уйдёт на его бэкенд. Передумаешь — &f/allay privacy agree"
  withdrawn: "&7Ты отозвал согласие: Allay стёр то, что оно покрывало (память, места, смерти, настройки, разговор), и не будет отвечать, пока ты не согласишься снова. &f/allay privacy erase&7 сотрёт остальное."
  not_given: "&7Согласия не было, отзывать нечего."
  changed: "&6Уведомление Allay о данных изменилось с тех пор, как ты согласился {date}."
  changed_undated: "&6Уведомление Allay о данных изменилось с тех пор, как ты соглашался."
  changed_summary: "&7Что нового: твои места, настройки, цели и смерти хранятся на бэкенде Allay в зашифрованном виде, а не на этом сервере; разговор хранится 30 дней; каждый вопрос идёт через OpenRouter в США; игроки из ЕС и США называют возраст; отзыв согласия стирает то, что оно покрывало; свои данные можно скачать по ссылке. Прочитай ещё раз и скажи, согласен ли ты."
