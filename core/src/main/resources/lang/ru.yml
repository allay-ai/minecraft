  age_why: "&7Закон (GDPR в ЕС, испанский LOPDGDD, COPPA в США) разрешает соглашаться на использование данных только игрокам старше определённого возраста, и он зависит от страны. Поэтому Allay сначала спрашивает твой возраст."
