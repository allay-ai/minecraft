privacy:
  info: "&6Was Allay auf diesem Server über dich speichert\n&7• Euer Gespräch, einen Tag nach deiner letzten Frage.\n&7• Die Fakten, die es sich merkt (&f/allay memory&7), bis du sie vergisst oder ein Jahr nach deiner letzten Frage.\n&7• Wie viele Fragen du gestellt hast und was sie gekostet haben, 400 Tage lang, dazu dein Name und deine UUID für das Admin-Panel des Allay-Backends, außer du schaltest volle Privatsphäre ein.\n&7• Nur auf diesem Server: dein Notizbuch, bis du die Notizen löschst, und deine letzten Tode (wann, wo und woran), damit es „Wann bin ich gestorben?“ beantworten kann.\n&7Andere Server sehen nichts davon."
