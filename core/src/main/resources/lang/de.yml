  own: "&3✦ &7{text}"
  enabled: "&a✔ Der Chatmodus ist an. &7Alles, was du in den Chat schreibst, geht jetzt an mich statt an die anderen."
  prefix_askx: "&f  ! &7am Anfang führt Befehle aus, wie /askx"
  prefix_public: "&f  ? &7am Anfang fragt so, dass alle es sehen"
  prefix_chat: "&f  ~ &7am Anfang schreibt in den normalen Chat"
  how_to_off: "&7Ausschalten: &f/allay chat off"
  disabled: "&7Der Chatmodus ist aus: Der Chat gehört wieder allen. Frag mich mit &f/ask&7."
