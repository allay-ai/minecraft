    open_hover: "&7Öffnet das Admin-Panel des Backends im Browser"
    copy: "&7[Link kopieren]"
    copy_hover: "&7Kopiert den Link, um ihn auf einem anderen Gerät zu öffnen"
    url: "&7Link: &f{url}"
    once: "&8Der Link gilt einmal und 30 Minuten lang. Wer ihn zuerst öffnet, besitzt das Panel – teil ihn also mit niemandem."
    recover: "&6Ein Link, mit dem du ein neues Passwort für ein Panel-Konto setzt, 30 Minuten lang gültig."
    recover_once: "&8Er gilt einmal. Wer ihn öffnet, kann das Passwort jedes Panel-Kontos ändern – teil ihn also mit niemandem."
