  unknown_player: "&cDieser Server hat nie einen Spieler {player} gesehen. Nimm seine UUID."
  unsupported: "&7Dieses Allay-Backend ist älter als 6.0 und kann die Daten eines Spielers weder exportieren noch löschen."
  usage: "&7Benutzung: &f/allay privacy &7[agree|withdraw|full|erase]; Admins: &f/allay privacy export|erase <Spieler|UUID>"
  full_on: "&aVolle Privatsphäre ist an: Das Admin-Panel des Allay-Backends sieht ein Pseudonym statt deines Namens, deiner UUID und deines Skins. Was du mir erzählt hast, merke ich mir weiter."
  full_off: "&7Volle Privatsphäre ist aus: Ab deiner nächsten Frage sieht das Admin-Panel wieder deinen Namen."
  full_is_on: "&7Volle Privatsphäre: &aan&7. Das Admin-Panel sieht ein Pseudonym statt deines Namens."
  full_is_off: "&7Volle Privatsphäre: &caus&7. Das Admin-Panel sieht deinen Namen. &f/allay privacy full on&7 verbirgt ihn."
  full_unsupported: "&7Gespeichert, aber dieses Allay-Backend ist älter als 6.5 und zeigt deinen Namen weiter im Admin-Panel."

consent:
  notice: "&6Bevor Allay dir antwortet\n&7Allay ist ein KI-Helfer. Für eine Antwort schickt es deine Frage, deinen Namen und deine UUID, deine Sprache und das, was es im Spiel für dich liest (Inventar, Umgebung, Koordinaten), an sein Backend."
  hosted: "&7Das Backend allay.chat speichert deine Daten auf Servern in der EU (Helsinki, Finnland) nach der DSGVO (Verordnung (EU) 2016/679) und dem spanischen Datenschutzgesetz (Ley Orgánica 3/2018, LOPDGDD). Die Antworten schreiben KI-Anbieter; manche sitzen in den USA und bekommen deine Frage mit den Garantien, die die DSGVO verlangt."
  self: "&7Dieser Server betreibt sein eigenes Allay-Backend: Sein Betreiber speichert deine Daten und steht dafür ein. Die Antworten schreibt der KI-Anbieter, den der Server gewählt hat."
  keeps: "&7Allay behält euer Gespräch einen Tag und gemerkte Fakten bis zu ein Jahr nach deiner letzten Frage. Die Antworten kommen von einer KI und können falsch sein. &f/allay privacy&7 zeigt, was gespeichert ist, und löscht es; &f/allay privacy withdraw&7 nimmt deine Zustimmung zurück."
  question: "&eEinverstanden?"
  agree: "&a[Ich stimme zu]"
  agree_hover: "&7Allay beantwortet deine Frage sofort"
  decline: "&c[Nein, danke]"
  decline_hover: "&7Allay antwortet dir nicht und speichert nichts"
  policy: "&9[Datenschutzerklärung]"
  policy_hover: "&7{url}"
  given: "&aDanke! Allay ist dran."
  given_idle: "&aDanke! Frag einfach mit &f/ask&a."
  declined: "&7Alles klar: Allay antwortet dir nicht und speichert nichts über dich. Doch anders entschieden? &f/allay privacy agree"
  withdrawn: "&7Zustimmung zurückgenommen: Allay antwortet dir erst wieder, wenn du zustimmst. Was schon gespeichert ist, bleibt bis &f/allay privacy erase&7."
  not_given: "&7Du hast nicht zugestimmt, also gibt es nichts zurückzunehmen."

