# Gespräch und Gedächtnis. Der Assistent merkt sich die letzten Fragen einen Tag lang und
# Wichtiges über den Spieler (seine Basis, seine Ziele), bis der Spieler ihn vergessen lässt.
memory:
  session_cleared: "&aWir fangen neu an. Was ich über dich weiß, bleibt: &f/allay memory"
  header: "&6Das weiß ich über dich:"
  line: "&e{n}. &f{text}"
  footer: "&7Vergessen: &f/allay forget <Nummer|all>"
  empty: "&7Ich weiß noch nichts über dich. Sag „merk dir, dass…“, dann merke ich es mir."
  forgot: "&aVergessen: &f{text}"
  forgot_all: "&aIch habe alles vergessen, was ich über dich wusste ({count})."
  forget_usage: "&7Verwendung: &f/allay forget <Nummer|all>&7. Die Nummern stehen in &f/allay memory"
  not_found: "&cEinen Eintrag Nummer {n} gibt es nicht. Die Liste: &f/allay memory"
  unsupported: "&cDieser Allay-Server kann sich noch nichts merken."
  remembered: "&aGemerkt: &f{text}"
  noted: "&aIm Notizbuch gespeichert: &f{text} &7({x} {y} {z}, {dimension})"
  full: "&cMein Gedächtnis ist voll. Lass mich erst etwas vergessen: &f/allay forget <Nummer>"
  remember_usage: "&7Verwendung: &f/allay memory <was ich mir merken soll>&7. Mit Koordinaten landet es im Notizbuch."

# Chatmodus: Was ein Spieler in den Chat schreibt, geht an Allay. ! führt Befehle aus, ? fragt vor allen,
# ~ schreibt in den normalen Chat. Der Tipp dazu erscheint unter dem zweiten /ask pro Besuch.
chat_mode:
