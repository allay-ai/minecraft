    unsupported: "&7Dieses Allay-Backend hat kein Admin-Panel: Es ist älter als 5.7."

privacy:
  info: "&6Was Allay auf diesem Server über dich speichert\n&7• Verschlüsselt, auf dem Allay-Backend: euer Gespräch, 30 Tage nach deiner letzten Frage; was es sich über dich merkt (&f/allay memory&7), mit Orten, dazu deine Einstellungen, Zeitzone, Ziele und Tode, bis du sie löschst oder ein Jahr nach deiner letzten Frage; Aufzeichnungen deiner Fragen, 30 Tage, um Fehler zu finden und zu beheben. Wer das Backend betreibt, öffnet eine nur, um einem Problem nachzugehen, und jeder Blick wird protokolliert.\n&7• Unverschlüsselt: dein Name, deine UUID und dein Operator-Status für das Admin-Panel (außer du schaltest volle Privatsphäre ein), die Zahlen deiner Fragen (wann, das Modell, die Kosten) und deine Zustimmung, 2 Jahre.\n&7• Verschlüsselte Backups von allem, bis zu 12 Monate.\n&7• Jede Frage geht über OpenRouter in den USA an den KI-Anbieter, der die Antwort schreibt.\n&7Andere Server sehen nichts davon."
  commands: "&f/allay privacy full on|off &7– volle Privatsphäre: Das Admin-Panel sieht ein Pseudonym statt deines Namens\n&f/allay privacy export &7– ein Link zu allem, was Allay über dich speichert, 24 Stunden lang\n&f/allay privacy withdraw &7– deine Zustimmung zurücknehmen; Allay antwortet dir dann nicht mehr\n&f/allay privacy erase &7– alles löschen, was Allay hier über dich speichert"
  admin: "&8Für Admins: &f/allay privacy export <Spieler> &8gibt einen Link zu den Daten eines Spielers, um ihn weiterzugeben, &f/allay privacy erase <Spieler> &8löscht sie."
  erase_confirm: "&eAlles löschen, was Allay auf diesem Server über dich speichert? Gedächtnis, Gespräch und die Verläufe deiner Agenten sind für immer weg; deine Fragen bleiben nur als anonyme Zahlen."
  erase_hover: "&7Lässt sich nicht rückgängig machen"
  erased_self: "&aErledigt: Allay hat dich auf diesem Server vergessen, {memories} {memories|Fakt|Fakten} eingeschlossen."
  export_ready: "&aDu kannst deine Daten bis {until} herunterladen. Wer den Link hat, kann sie öffnen – behalte ihn also für dich:"
  export_ready_for: "&aEin Link zu dem, was Allay über {player} speichert, gültig bis {until}. Das sind persönliche Daten: Gib ihn nur dieser Person:"
  export_button: "&9[Herunterladen]"
  export_hover: "&7Öffnet den Download im Browser"
  export_unsupported: "&7Dieses Allay-Backend ist älter als 6.9 und kann keine Download-Links erstellen."
  erased: "&aGelöscht, was Allay über {player} gespeichert hatte: {memories} {memories|Fakt|Fakten}; {runs} {runs|Frage zählt|Fragen zählen} jetzt als niemandes."
  unknown_player: "&cDieser Server hat nie einen Spieler {player} gesehen. Nimm seine UUID."
  unsupported: "&7Dieses Allay-Backend ist älter als 6.0 und kann die Daten eines Spielers weder exportieren noch löschen."
  usage: "&7Verwendung: &f/allay privacy &7[agree|withdraw|full|export|erase]; Admins: &f/allay privacy export|erase <Spieler|uuid>"
  full_on: "&aVolle Privatsphäre ist an: Das Admin-Panel des Allay-Backends sieht ein Pseudonym statt deines Namens, deiner UUID und deines Skins. Was du mir erzählt hast, merke ich mir weiter."
  full_off: "&7Volle Privatsphäre ist aus: Ab deiner nächsten Frage sieht das Admin-Panel wieder deinen Namen."
  full_is_on: "&7Volle Privatsphäre: &aan&7. Das Admin-Panel sieht ein Pseudonym statt deines Namens."
  full_is_off: "&7Volle Privatsphäre: &caus&7. Das Admin-Panel sieht deinen Namen. &f/allay privacy full on&7 verbirgt ihn."
  full_unsupported: "&7Gespeichert, aber dieses Allay-Backend ist älter als 6.5 und zeigt deinen Namen weiter im Admin-Panel."
  window:
    title: "Deine Daten"
    full_is_on: "&7Volle Privatsphäre: &aan&7. Das Admin-Panel kennt dich unter einem Pseudonym."
    full_is_off: "&7Volle Privatsphäre: &caus&7. Das Admin-Panel sieht deinen Namen."
    full_on: "Volle Privatsphäre einschalten"
    full_off: "Volle Privatsphäre ausschalten"
    full_hover: "&7Das Admin-Panel des Backends sieht ein Pseudonym statt Name, UUID und Skin; Allay merkt sich alles wie bisher"
    export: "Meine Daten herunterladen"
    export_hover: "&7Ein Link im Chat, 24 Stunden gültig"
    withdraw: "Zustimmung zurücknehmen"
    withdraw_hover: "&7Allay antwortet dir nicht mehr und löscht, was die Zustimmung abdeckte"
    withdraw_title: "Zustimmung zurücknehmen?"
    withdraw_about: "Allay antwortet dir nicht mehr, deine Agenten halten an, und Erinnerungen, Orte, Tode, Einstellungen und das Gespräch werden gelöscht. Mit deiner nächsten Frage kannst du wieder zustimmen."
    withdraw_yes: "&cZurücknehmen"
    erase: "Alles löschen"
    erase_title: "Alles löschen?"
    erase_yes: "&cAlles löschen"

consent:
  notice: "&6Bevor Allay dir antwortet\n&7Allay ist ein KI-Helfer. Für eine Antwort schickt es deine Frage, deinen Namen und deine UUID, deine Sprache und das, was es im Spiel für dich liest (Inventar, Umgebung, Koordinaten), an sein Backend."
  hosted: "&7Wer {server} betreibt, steht dort für Allay ein; allay.chat betreibt dafür das Allay-Backend, auf Servern in Helsinki (Finnland), nach der DSGVO und Spaniens LOPDGDD, mit verschlüsselten Backups bei Cloudflare. Jede Frage geht über OpenRouter in den USA an den KI-Anbieter, der die Antwort schreibt."
  self: "&7Wer {server} betreibt, hat ein eigenes Allay-Backend und speichert deine Daten. Jede Frage geht an den KI-Anbieter, den der Server gewählt hat."
  keeps: "&7Verschlüsselt gespeichert: das Gespräch 30 Tage, Erinnerungen, Orte, Tode, Einstellungen und Ziele ein Jahr nach deiner letzten Frage, Aufzeichnungen der Fragen 30 Tage. Unverschlüsselt: dein Name, deine UUID, deine Zustimmung und die Zahlen deiner Fragen, 2 Jahre. Backups bis zu 12 Monate. Die Antworten kommen von einer KI und können falsch sein. &f/allay privacy&7 zeigt, exportiert und löscht es; &f/allay privacy withdraw&7 nimmt deine Zustimmung zurück und löscht, was sie abdeckte."
  title: "Allay und deine Daten"
  agree: "&aIch stimme zu"
  agree_hover: "&7Allay beantwortet deine Frage sofort"
  decline: "&cNein, danke"
  decline_hover: "&7Allay antwortet dir nicht und schickt nichts über dich"
  policy: "Datenschutzerklärung"
  policy_hover: "&7{url}"
  given: "&aDanke! Allay ist dran."
  given_idle: "&aDanke! Frag einfach mit &f/ask&a."
  already: "&7Du hast schon zugestimmt. &f/allay privacy&7 zeigt, was Allay über dich speichert."
  reopen: "&7Bevor Allay antwortet, fragt es dich in einem Fenster."
  reopen_button: "&f[Wieder öffnen]"
  reopen_hover: "&7Öffnet das Fenster noch einmal"
  declined: "&7Alles klar: Allay antwortet dir nicht, und nichts über dich geht an sein Backend. Doch anders entschieden? &f/allay privacy agree"
  withdrawn: "&7Du hast deine Zustimmung zurückgenommen: Allay hat gelöscht, was sie abdeckte (Erinnerungen, Orte, Tode, Einstellungen, das Gespräch), und antwortet dir erst wieder, wenn du erneut zustimmst. &f/allay privacy erase&7 löscht den Rest."
  not_given: "&7Du hast nicht zugestimmt, also gibt es nichts zurückzunehmen."
  changed: "&6Allays Datenschutzhinweis hat sich geändert, seit du am {date} zugestimmt hast."
  changed_undated: "&6Allays Datenschutzhinweis hat sich seit deiner letzten Zustimmung geändert."
  changed_summary: "&7Neu: Deine Orte, Einstellungen, Ziele und Tode liegen verschlüsselt auf dem Allay-Backend, nicht auf diesem Server; das Gespräch bleibt 30 Tage; jede Frage geht über OpenRouter in den USA; Spieler aus der EU und den USA nennen ihr Alter; wer die Zustimmung zurücknimmt, löscht, was sie abdeckte; deine Daten kannst du per Link herunterladen. Lies ihn noch einmal und sag, ob du zustimmst."
  age_question: "Wie alt bist du?"
  age_under: "&7Danke, dass du es sagst. Hier kann Allay Spielern in deinem Alter nicht antworten, schickt also nichts über dich und merkt sich nur ein Jahr lang, dass du geantwortet hast."
  age_why: "&7Das Gesetz (die DSGVO in der EU, Spaniens LOPDGDD, COPPA in den USA) lässt nur Spieler ab einem bestimmten Alter, je nach Land, der Nutzung ihrer Daten zustimmen. Deshalb muss Allay zuerst dein Alter wissen."
  age_under13: "Unter 13"
  age_13: "13"
  age_14_15: "14–15"
  age_16_17: "16–17"
  age_18: "18 oder älter"
  age_hover: "&7Allay merkt sich nur, ob du alt genug bist, um zuzustimmen"
  age_blocked: "&7Allay kann dir hier noch nicht antworten: Du hast gesagt, dass du zu jung bist, um der Nutzung deiner Daten zuzustimmen. Es fragt ein Jahr nach deiner Antwort wieder."
