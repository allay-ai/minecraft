privacy:
  info: "&6Lo que Allay guarda de ti en este servidor\n&7• Cifrado, en el backend de Allay: vuestra conversación, 30 días después de tu última pregunta; lo que recuerda de ti (&f/allay memory&7), lugares incluidos, y tus ajustes, zona horaria, metas y muertes, hasta que los borres o un año después de tu última pregunta; los registros de tus preguntas, 30 días, para encontrar y corregir errores. Quien opera el backend abre un registro solo para investigar un problema, y cada consulta queda registrada.\n&7• Sin cifrar: tu nombre, UUID y estado de operador para el panel de administración (salvo que actives la privacidad total), las cifras de tus preguntas (cuándo, el modelo, el coste) y tu consentimiento, 2 años.\n&7• Copias de seguridad cifradas de todo ello, hasta 12 meses.\n&7• Cada pregunta pasa por OpenRouter en EE. UU. hasta el proveedor de IA que escribe la respuesta.\n&7Otros servidores nunca ven nada de esto."
  commands: "&f/allay privacy full on|off &7– privacidad total: el panel de administración ve un seudónimo en vez de tu nombre\n&f/allay privacy export &7– un enlace a todo lo que Allay guarda de ti, durante 24 horas\n&f/allay privacy withdraw &7– retirar tu consentimiento; Allay deja de responderte\n&f/allay privacy erase &7– borrar todo lo que Allay guarda de ti aquí"
  admin: "&8Para admins: &f/allay privacy export <jugador> &8da un enlace a los datos de un jugador para entregárselo, &f/allay privacy erase <jugador> &8los borra."
  erase_confirm: "&e¿Borrar todo lo que Allay guarda de ti en este servidor? La memoria, la conversación y los hilos de tus agentes desaparecen para siempre; tus preguntas quedan solo como números anónimos."
  erase_hover: "&7No se puede deshacer"
  erased_self: "&aHecho: Allay te olvidó en este servidor, con {memories} {memories|dato|datos}."
