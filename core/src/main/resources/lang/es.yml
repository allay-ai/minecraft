# La conversación y la memoria. El asistente recuerda las preguntas recientes durante un día, y los
# datos duraderos del jugador (su base, sus objetivos) hasta que el jugador le pida olvidarlos.
memory:
  session_cleared: "&aEmpezamos de nuevo. Lo que recuerdo de ti sigue ahí: &f/allay memory"
  header: "&6Lo que recuerdo de ti:"
  line: "&e{n}. &f{text}"
  line_place: "&e{n}. &f{text} &7({x} {y} {z}, {dimension})"
  empty: "&7Todavía no recuerdo nada de ti. Dime “recuerda que…” y lo haré."
  unsupported: "&cEste servidor de Allay aún no puede guardar recuerdos."
  remembered: "&aRecordado: &f{text}"
  noted: "&aRecordado con el lugar: &f{text} &7({x} {y} {z}, {dimension})"
  full: "&cMi memoria está llena. Haz que olvide algo primero: &f/allay memory"
  remember_usage: "&7Uso: &f/allay memory add <qué recordar>&7. Con coordenadas, recuerdo también el lugar."
  window:
    title: "Lo que Allay recuerda"
    about: "Allay recuerda {count} {count|cosa|cosas} sobre ti. Pulsa una para verla, ir a su lugar u olvidarla."
    add: "+ Recordar algo"
    add_hover: "&7Escribe lo que Allay debe recordar"
    open_hover: "&f{text}"
    clear: "Olvidar todo"
    clear_hover: "&7Borra toda la memoria; no se puede deshacer"
    one: "Un recuerdo"
    place: "&7Lugar: &f{x} {y} {z}&7, {dimension}"
    way: "Mostrar el camino"
    way_hover: "&7Un rastro y la brújula te llevan allí"
    forget: "Olvidar"
    forget_hover: "&7Allay lo olvida al momento"
    add_title: "Recordar"
    add_about: "Escribe lo que Allay debe recordar. “Con mi lugar” guarda también dónde estás ahora; las coordenadas en el texto también sirven."
