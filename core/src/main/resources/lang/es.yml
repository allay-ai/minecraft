  # Patrones de fecha de Java: cómo se lee “14 de noviembre”, y con el año si no es el actual.
  date: "d 'de' MMMM"
  date_year: "d 'de' MMMM 'de' yyyy"
  no_billing: "&aEste backend de Allay funciona con su propia clave: no hay nada que pagar."
  unsupported: "&7Este backend de Allay no tiene suscripciones: es anterior a la 5.0."
  license_invalid: "&cEste backend no conoce la licencia de license.key. Revisa server.url en config.yml, o borra license.key y usa &f/allay link&c para obtener una nueva."
  license_broken: "&clicense.key no contiene una licencia. Arréglalo, o bórralo y usa &f/allay link&c para obtener una nueva."
  plans:
    week: "semanal"
    month: "mensual"
    year: "anual"
    solo_week: "Solo semanal"
    solo_month: "Solo mensual"
    solo_year: "Solo anual"
  link:
    byok: "&7/allay link es para la suscripción. Ahora este servidor paga con su propia clave; para cambiar, pon &fprovider.mode: hosted&7 en config.yml y usa &f/allay reload&7."
