consent:
  notice: "&6Antes de que Allay te responda\n&7Allay es un asistente de IA. Para responder, envía a su backend tu pregunta, tu nombre y UUID, tu idioma y lo que lee en el juego para ti (inventario, alrededores, coordenadas)."
  hosted: "&7Quien gestiona {server} responde de Allay en él; allay.chat le gestiona el backend de Allay, en servidores en Helsinki (Finlandia), bajo el RGPD y la LOPDGDD española, con copias de seguridad cifradas en Cloudflare. Cada pregunta pasa por OpenRouter en EE. UU. hasta el proveedor de IA que escribe la respuesta."
  self: "&7Quien gestiona {server} tiene su propio backend de Allay y guarda tus datos. Cada pregunta va al proveedor de IA que eligió el servidor."
  keeps: "&7Se guarda cifrado: la conversación 30 días, la memoria, los lugares, las muertes, los ajustes y las metas un año después de tu última pregunta, los registros de preguntas 30 días. Se guarda tal cual: tu nombre, tu UUID, tu consentimiento y las cifras de tus preguntas, 2 años. Copias de seguridad hasta 12 meses. Las respuestas vienen de una IA y pueden fallar. &f/allay privacy&7 lo muestra, lo exporta y lo borra; &f/allay privacy withdraw&7 retira tu consentimiento y borra lo que cubría."
  title: "Allay y tus datos"
  agree: "&aAcepto"
  agree_hover: "&7Allay responde a tu pregunta enseguida"
  decline: "&cNo, gracias"
  decline_hover: "&7Allay no te responderá ni enviará nada sobre ti"
  policy: "Política de privacidad"
  policy_hover: "&7{url}"
  given: "&a¡Gracias! Allay ya está en ello."
  given_idle: "&a¡Gracias! Pregunta con &f/ask&a."
  already: "&7Ya diste tu consentimiento. &f/allay privacy&7 muestra lo que Allay guarda sobre ti."
  reopen: "&7Antes de responder, Allay te pregunta en una ventana."
  reopen_button: "&f[Abrir de nuevo]"
  reopen_hover: "&7Vuelve a abrir la ventana"
  declined: "&7Vale: Allay no te responderá y nada sobre ti llegará a su backend. ¿Cambias de idea? &f/allay privacy agree"
  withdrawn: "&7Retiraste tu consentimiento: Allay borró lo que cubría (memoria, lugares, muertes, ajustes, la conversación) y no te responderá hasta que vuelvas a aceptar. &f/allay privacy erase&7 borra el resto."
  not_given: "&7No diste tu consentimiento, así que no hay nada que retirar."
  changed: "&6El aviso de privacidad de Allay cambió desde que lo aceptaste el {date}."
  changed_undated: "&6El aviso de privacidad de Allay cambió desde la última vez que lo aceptaste."
  changed_summary: "&7Novedades: tus lugares, ajustes, metas y muertes están en el backend de Allay, cifrados, no en este servidor; la conversación se guarda 30 días; cada pregunta pasa por OpenRouter en EE. UU.; los jugadores de la UE y EE. UU. dicen su edad; retirar el consentimiento borra lo que cubría; puedes descargar tus datos con un enlace. Léelo otra vez y di si estás de acuerdo."
  age_question: "¿Cuántos años tienes?"
  age_under: "&7Gracias por decírmelo. Aquí Allay no puede responder a jugadores de tu edad, así que no envía nada sobre ti y solo guarda que respondiste, durante un año."
  age_why: "&7La ley (el RGPD en la UE, la LOPDGDD en España, la COPPA en EE. UU.) solo deja aceptar el uso de sus datos a jugadores a partir de cierta edad, que depende del país. Por eso Allay necesita saber primero tu edad."
