  age_16_17: "16–17"
  age_18: "18 o más"
  age_hover: "&7Allay solo guarda si tienes edad para aceptar"
  age_blocked: "&7Allay aún no puede responderte aquí: dijiste que eres demasiado joven para aceptar el uso de tus datos. Volverá a preguntar un año después de tu respuesta."
