    no_license: "&7Todavía no hay licencia. Consíguela y paga con &f/allay link&7."
    license: "&7Licencia: &f{id}"
    linked: "&7Telegram: &fvinculado"
    not_linked: "&7Telegram: &eaún sin vincular&7; abre el enlace de &f/allay link"
    active: "&7Suscripción: &aactiva"
    inactive: "&7Suscripción: &cinactiva&7; paga con &f/allay link"
    plan: "&7Plan: &f{plan}&7, pagado hasta el &f{date}"
    unpaid: "&7Aún no hay nada pagado. Para pagar: &f/allay link&7."
    renews: "&7Se renueva sola en Telegram."
