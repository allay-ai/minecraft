# Textos de Allay en español. Cada jugador lee el archivo de su idioma; una clave que
# falte aquí se toma de locales.default y luego del inglés. Un texto vacío ("") desactiva
# el mensaje. Los colores usan códigos & (&a, &7, &f…). Las variables tienen la forma {name};
# los plurales, {count|stack|stacks}: el número de {count} elige la forma.
# Con PlaceholderAPI, {papi:name} muestra %name% del jugador del que habla el mensaje.

status:
  # La línea en vivo sobre la barra rápida mientras el asistente trabaja, como en Claude Code:
  # spinner, un verbo que va cambiando, segundos, tokens leídos (↑) y escritos (↓).
  line: "&6{spinner} &6{verb}… &7({seconds}s · ↑ {input} · ↓ {output} {tokens|token|tokens})"
  answering: "Escribiendo la respuesta"
  verbs:
    - "Hojeando el libro de recetas"
    - "Fundiendo ideas en el horno"
    - "Encantando la respuesta"
    - "Preparando una poción de sabiduría"
    - "Consultando al bibliotecario"
    - "Mirando el mapa"
    - "Tirando redstone"
    - "Tarareando una melodía"
    - "Dando vueltas al bloque musical"
    - "Afilando el pico"
    - "Picando en Y −59"
    - "Buscando algo brillante"
    - "Rebuscando en los cofres"
    - "Revoloteando sobre los cofres"
    - "Trayéndote el objeto justo"
    - "Pasando a escondidas junto al Warden"
    - "Discutiendo con un creeper"
    - "Bailando con el tocadiscos"
  askx_verbs:
    - "Configurando un bloque de comandos"
    - "Eligiendo el selector @s"
    - "Revisando la sintaxis"
    - "Girando el comparador"

tool_lines:
  # Una línea en el chat cuando el asistente usa una herramienta, y el resultado debajo.
  started: "&7⏺ {label}"
  finished: "&8  ⎿ {summary}"
  # El motivo ({reason}) está escrito en inglés para el asistente, así que aquí no aparece.
  failed: "&c  ⎿ no salió"
  unknown: "Usando {name}"
  # Another plugin's or mod's tool, by its name.
  expansion: "Consultando {name}"

