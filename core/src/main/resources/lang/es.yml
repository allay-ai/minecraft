    recover: "&6Un enlace para poner una contraseña nueva a una cuenta del panel, válido durante 30 minutos."
    recover_once: "&8Funciona una vez. Quien lo abra puede cambiar la contraseña de cualquier cuenta del panel, así que no lo compartas."
