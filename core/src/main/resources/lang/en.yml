    export_hover: "&7A link in chat, good for 24 hours"
    withdraw: "Take my agreement back"
    withdraw_hover: "&7Allay stops answering you and erases what the agreement covered"
    withdraw_title: "Take your agreement back?"
    withdraw_about: "Allay stops answering you, your agents stop, and it erases memories, places, deaths, settings, and the conversation. You can agree again with your next question."
    withdraw_yes: "&cTake it back"
