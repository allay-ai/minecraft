# Allay texts in English. Every player reads the file of their own language; a key
# missing here comes from locales.default, then from English. An empty text ("") turns
# a message off. Colors use & codes (&a, &7, &f…). Placeholders look like {name};
# plurals look like {count|stack|stacks}: the form is picked by the number in {count}.
# With PlaceholderAPI, {papi:name} shows %name% for the player the message is about.

status:
  # The live line in the action bar while the assistant works, like Claude Code:
  # spinner, a changing verb, seconds, tokens read (↑) and written (↓).
  line: "&6{spinner} &6{verb}… &7({seconds}s · ↑ {input} · ↓ {output} {tokens|token|tokens})"
  answering: "Writing the answer"
  verbs:
    - "Flipping through the recipe book"
    - "Smelting thoughts in the furnace"
    - "Enchanting the answer"
    - "Brewing a potion of wisdom"
    - "Asking the librarian"
    - "Checking the map"
    - "Running redstone"
    - "Humming a tune"
    - "Circling the note block"
    - "Sharpening the pickaxe"
    - "Digging at Y −59"
    - "Looking for something shiny"
    - "Sorting through chests"
    - "Fluttering over the chests"
    - "Bringing you the right item"
    - "Sneaking past the Warden"
    - "Arguing with a creeper"
    - "Dancing to the jukebox"
  askx_verbs:
    - "Setting up a command block"
    - "Picking the @s selector"
    - "Checking the syntax"
    - "Turning the comparator"

tool_lines:
  # A line in chat when the assistant uses a tool, and the result under it.
  started: "&7⏺ {label}"
  finished: "&8  ⎿ {summary}"
  # {reason} is written for the assistant, in English.
  failed: "&c  ⎿ {reason}"
  unknown: "Using {name}"

