  not_on_this_server: "&3✦ &bAllay &8»&7 Allay doesn't run on this server, so I can't answer here. I work in your singleplayer world, and on servers that have Allay: ask the owner to add it from &fallay.chat&7."
  usage: "&7Usage: &f/ask <question>\n&7Example: &f/ask how do I craft a diamond pickaxe?\n&7In front of everyone: &f/askall <question>&7, chat mode and more: &f/allay"
