# Paying for the model, for admins: /allay status and /allay link. A server pays with its own key
# (provider.mode: byok in config.yml) or with Allay's subscription, paid in Telegram Stars (hosted).
billing:
  # Java date patterns: how “14 November” reads, and with the year when it isn't this one.
  date: "d MMMM"
  date_year: "d MMMM yyyy"
  no_billing: "&aThis Allay backend serves you on its own key: there's nothing to pay."
  unsupported: "&7This Allay backend has no subscriptions: it's older than 5.0."
  license_invalid: "&cThis backend doesn't know the license in license.key. Check server.url in config.yml, or delete license.key and run &f/allay link&c for a new one."
  license_broken: "&clicense.key doesn't hold a license. Fix it, or delete it and run &f/allay link&c for a new one."
  plans:
    week: "weekly"
    month: "monthly"
    year: "yearly"
  link:
    byok: "&7/allay link is for the subscription. This server pays with its own key now; to switch, set &fprovider.mode: hosted&7 in config.yml and run &f/allay reload&7."
    created: "&aA new license is saved in &fplugins/Allay/license.key&a. Keep it to yourself: whoever has it uses your subscription."
    ready: "&6Pick a plan and pay for Allay in Telegram Stars:"
    pay: "&a[Pay in Telegram]"
    pay_hover: "&7Opens Allay's bot in Telegram"
    copy: "&7[Copy link]"
    copy_hover: "&7Copies the link, to open it on another device"
    url: "&7Link: &f{url}"
    once: "&8The link works once and for 24 hours. Whoever opens it first ties the subscription to their Telegram, so don't share it."
  status:
    header: "&6Allay · who pays for the model"
    byok: "&7Mode: &fyour own key &8(provider.mode: byok)"
    base_url: "&7API: &f{url}"
    model: "&7Model: &f{model}"
    search_model: "&7Search model: &f{model}"
    default_model: "the backend's default"
    no_search: "none, so no web search"
    key: "&7Key: &f{key}"
    no_key: "&cKey: empty. Put yours in provider.byok.api_key in config.yml and run /allay reload."
    hosted: "&7Mode: &fsubscription &8(provider.mode: hosted)"
    legacy_key: "&7The key in http.custom_headers (X-OpenRouter-Token, &f{key}&7) pays for the model, with the backend's default models."
    no_license: "&7No license yet. Get one and pay with &f/allay link&7."
    license: "&7License: &f{id}"
    linked: "&7Telegram: &flinked"
    not_linked: "&7Telegram: &enot linked yet&7; open the link from &f/allay link"
    active: "&7Subscription: &aactive"
    inactive: "&7Subscription: &cnot active&7; pay with &f/allay link"
    plan: "&7Plan: &f{plan}&7, paid until &f{date}"
    unpaid: "&7Nothing paid yet. To pay: &f/allay link&7."
    renews: "&7Renews by itself in Telegram."
    no_renew: "&7Doesn't renew by itself: pay again before it ends with &f/allay link&7."
    quota: "&7Limit: {bar}"
    quota_used: "&7{percent}% of this period's limit used, refills {date}."
    quota_used_no_reset: "&7{percent}% of this period's limit used."
    token: "&7Signs in with: &fserver.token &8({token})"
    identity: "&7Identity on the backend: &flicense {id} &8(free; your key pays)"
  # What admins online hear when the subscription changes. Allay checks every 5 minutes.
  notice:
    paid: "&a✔ Allay is active until {date}."
    quota_80: "&eAllay has used 80% of this server's limit. It refills {date}."
    quota_100: "&cAllay has used up this server's limit: players get a short note instead of answers until it refills {date}, or until you top it up."
    quota_80_no_reset: "&eAllay has used 80% of this server's limit for this period."
    quota_100_no_reset: "&cAllay has used up this server's limit: players get a short note instead of answers until you top it up."
    expiring: "&eAllay's subscription ends {date} and doesn't renew by itself."
    renew: "&a[Renew]"
    renew_hover: "&7Runs /allay link: a link to pay in Telegram"
  # Under an error, for admins only: what fixes it.
  hint:
    subscription: "&8Admins: pay or renew in Telegram."
    link: "&a[/allay link]"
    LICENSE_INVALID: "&8Admins: this backend doesn't know license.key. Check server.url, or delete license.key and run /allay link."
    PROVIDER_AUTH_FAILED: "&8Admins: the provider refused the key in provider.byok.api_key ({key}). Check it in config.yml and run /allay reload."
    MODEL_NOT_FOUND: "&8Admins: the provider doesn't know the model “{model}”. Fix provider.byok.model in config.yml."
    MODEL_NO_TOOLS: "&8Admins: the model “{model}” can't call tools, and Allay needs them. Pick one that can in provider.byok.model (OpenRouter's model list filters by “Tools”)."
    PROVIDER_URL_REJECTED: "&8Admins: the backend won't call {url}. provider.byok.base_url must be https and point to a public address."
    TOKEN_REQUIRED: "&8Admins: this self-hosted backend wants a token. Set server.token in config.yml to the backend's PLUGIN_TOKEN and run /allay reload."
    TOKEN_INVALID: "&8Admins: the backend doesn't take server.token. Set it to the backend's PLUGIN_TOKEN and run /allay reload."
    TOKEN_NOT_SET: "&8Admins: the backend has no PLUGIN_TOKEN, so it answers no plugin. Set one of 24 characters or more there, and the same in server.token."
    identity: "&8Admins: this backend wants a license as the server's identity, free with your own key, and Allay couldn't get one yet. It tries again with the next question; the log says why."

