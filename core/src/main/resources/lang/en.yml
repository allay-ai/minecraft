# The conversation and memory. The assistant remembers recent questions for a day and lasting
# facts about the player (their base, their goals) until the player asks it to forget.
memory:
  session_cleared: "&aStarting over. What I remember about you stays: &f/allay memory"
  header: "&6What I remember about you:"
  line: "&e{n}. &f{text}"
  footer: "&7To forget: &f/allay forget <number|all>"
  empty: "&7I don't remember anything about you yet. Say “remember that…” and I will."
  forgot: "&aForgot: &f{text}"
  forgot_all: "&aForgot everything I remembered about you ({count})."
  forget_usage: "&7Usage: &f/allay forget <number|all>&7. The numbers are in &f/allay memory"
  not_found: "&cThere's no entry number {n}. The list: &f/allay memory"
  unsupported: "&cThis Allay server can't keep memories yet."
  remembered: "&aRemembered: &f{text}"
  noted: "&aSaved to the notebook: &f{text} &7({x} {y} {z}, {dimension})"
  full: "&cMy memory is full. Make me forget something first: &f/allay forget <number>"
  remember_usage: "&7Usage: &f/allay memory <what to remember>&7. With coordinates, it goes to the notebook."

# Chat mode: what a player writes in chat goes to Allay. ! runs commands, ? asks so everyone
# sees it, ~ writes to the ordinary chat. The tip about it shows under the second /ask of a visit.
chat_mode:
  # Your own line in chat mode, marked like Allay's answers but without a name.
  own: "&3✦ &7{text}"
  enabled: "&a✔ Chat mode is on. &7Everything you write in chat now comes to me instead of the other players."
  prefix_askx: "&f  ! &7at the start runs commands, like /askx"
  prefix_public: "&f  ? &7at the start asks so everyone sees it"
  prefix_chat: "&f  ~ &7at the start writes to the ordinary chat"
  how_to_off: "&7To turn it off: &f/allay chat off"
  disabled: "&7Chat mode is off: the chat is everyone's again. Ask me with &f/ask&7."
  reminder: "&8※ Chat mode is on: write to me right in chat. &7~&8 at the start goes to the ordinary chat, &7/allay chat off&8 turns it off."
  no_askx: "&cCommands with ! aren't available to you."
  no_askall: "&cYou can't ask in front of everyone."
  hints_off: "&7Got it, I won't suggest it again. Chat mode turns on with &f/allay chat&7."
  hints_on: "&7The tip about chat mode is back on."
  tip: "&8※ You can write to me right in chat, without /ask."
  tip_enable: "&7[Chat mode]"
  tip_enable_hover: "&7Turn on chat mode: whatever you write in chat comes to me"
  tip_hide: "&8[Don't show again]"
  tip_hide_hover: "&7Stop suggesting chat mode"

# Questions everyone sees (/askall, ? in chat mode): every player online reads the question and the answer.
public:
  question: "&3✦ &b{player} &7asks Allay:&f {text}"
  answer: "&3✦ &bAllay &8»&r {text}"
  failed: "&8✦ Allay couldn't answer this time."
  cooldown: "&7You can ask everyone again in {seconds} {seconds|second|seconds}."
  vanished: "&7You're vanished, so this one stays between you and Allay."

