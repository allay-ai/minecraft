  answer: "&3✦ &bAllay &8»&r {text}"
  usage: "&7Usage: &f/ask <question>\n&7Example: &f/ask how do I craft a diamond pickaxe?\n&7In front of everyone: &f/askall <question>&7, chat mode and more: &f/allay"
  askx_usage: "&7Usage: &f/askx <what to do>\n&7Example: &f/askx give me a diamond sword with sharpness 5"
  askall_usage: "&7Usage: &f/askall <question>&7 – everyone online sees the question and the answer"
  allay_usage: "&6Allay\n&f/allay chat &7[on|off] – chat mode\n&f/allay hints &7[on|off] – the tip about chat mode\n&f/allay cancel &7– stop the answer\n&f/allay new &7– start the conversation over\n&f/allay memory &7– what I remember about you\n&f/allay forget &7<number|all> – forget it\n&f/allay recipe &7<item>, &f/allay enchants&7, &f/allay villagers &7– the windows\n&f/allay language &7[code|auto] – the language I speak to you\n&f/allay privacy &7– what I keep about you, and erasing it"
  language_set: "&7I speak &f{language}&7 to you now."
  language_auto: "&7I pick your language by myself again: &f{language}&7."
  language_unknown: "&cThere's no language {code}. Choose one of: {codes}"
  allay_admin_usage: "&6For admins\n&f/allay status &7– who pays for the model\n&f/allay link &7– pay for the subscription in Telegram\n&f/allay locale &7[player] – which language a player gets, and why\n&f/allay init &7– set up the backend's admin panel\n&f/allay reload &7– reload settings and languages\n&f/allay privacy export|erase &7<player> – a player's data, on their request"
