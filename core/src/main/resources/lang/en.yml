consent:
  notice: "&6Before Allay answers you\n&7Allay is an AI helper. To answer, it sends your question, your name and UUID, your language, and what it reads in the game for you (inventory, surroundings, coordinates) to its backend."
  hosted: "&7The owner of {server} answers for Allay on it; allay.chat runs Allay's backend for them, on servers in Helsinki, Finland, under the GDPR and Spain's LOPDGDD, with encrypted backups at Cloudflare. Every question goes through OpenRouter in the USA to the AI provider that writes the answer."
  self: "&7The owner of {server} runs its own Allay backend and keeps your data. Every question goes to the AI provider the server picked."
  keeps: "&7Kept encrypted: the conversation 30 days, memories, places, deaths, settings, and goals a year after your last question, records of questions 30 days. Kept as is: your name, UUID, your agreement, and the numbers of your questions, 2 years. Backups up to 12 months. Answers come from an AI and can be wrong. &f/allay privacy&7 shows, exports, and erases it; &f/allay privacy withdraw&7 takes your agreement back and erases what it covered."
  title: "Allay and your data"
  agree: "&aI agree"
  agree_hover: "&7Allay answers your question right away"
  decline: "&cNo, thanks"
  decline_hover: "&7Allay won't answer you or send anything about you"
  policy: "Privacy policy"
  policy_hover: "&7{url}"
  given: "&aThanks! Allay is on it."
  given_idle: "&aThanks! Ask away with &f/ask&a."
  already: "&7You've already agreed. &f/allay privacy&7 shows what Allay keeps about you."
  reopen: "&7Allay asks you in a window before it answers."
  reopen_button: "&f[Open again]"
  reopen_hover: "&7Opens the window once more"
  declined: "&7Fine: Allay won't answer you, and nothing about you goes to its backend. Changed your mind? &f/allay privacy agree"
  withdrawn: "&7You took your agreement back: Allay erased what it covered (memories, places, deaths, settings, the conversation) and won't answer you until you agree again. &f/allay privacy erase&7 removes the rest."
  not_given: "&7You haven't agreed to anything, so there's nothing to take back."
  changed: "&6Allay's privacy notice changed since you agreed on {date}."
  changed_undated: "&6Allay's privacy notice changed since you last agreed."
  changed_summary: "&7What's new: your places, settings, goals, and deaths live on Allay's backend, encrypted, not on this server; the conversation stays 30 days; every question goes through OpenRouter in the USA; players in the EU and the US say their age; taking your agreement back erases what it covered; you can download your data with a link. Read it once more and say whether you agree."
  age_question: "How old are you?"
  age_under: "&7Thanks for telling me. Here Allay can't answer players your age, so it sends nothing about you and keeps only that you answered, for a year."
  age_why: "&7The law (the GDPR in the EU, Spain's LOPDGDD, COPPA in the US) lets only players above a certain age, which depends on the country, agree to their data being used. So Allay needs to know your age first."
