privacy:
  info: "&6What Allay keeps about you on this server\n&7• Encrypted, on Allay's backend: your conversation, 30 days after your last question; what it remembers about you (&f/allay memory&7), places included, and your settings, time zone, goals, and deaths, until you delete them or a year after your last question; records of your questions, 30 days, to find and fix errors. The backend's operator opens a record only to look into a problem, and each look is logged.\n&7• Not encrypted: your name, UUID, and operator status for the admin panel (unless you turn on full privacy), the numbers of your questions (when, the model, the cost), and your agreement, 2 years.\n&7• Encrypted backups of all of it, up to 12 months.\n&7• Every question goes through OpenRouter in the USA to the AI provider that writes the answer.\n&7Other servers never see any of it."
  commands: "&f/allay privacy full on|off &7– full privacy: the admin panel sees a pseudonym instead of your name\n&f/allay privacy export &7– a link to everything Allay keeps about you, for 24 hours\n&f/allay privacy withdraw &7– take your agreement back; Allay stops answering you\n&f/allay privacy erase &7– erase everything Allay keeps about you here"
  admin: "&8Admins: &f/allay privacy export <player> &8gets a link to a player's data to hand to them, &f/allay privacy erase <player> &8erases it."
  erase_confirm: "&eErase everything Allay keeps about you on this server? Memories, the conversation, and your agents' threads go for good; your questions stay only as anonymous numbers."
  erase_hover: "&7Can't be undone"
  erased_self: "&aDone: Allay forgot you on this server, {memories} {memories|memory|memories} included."
  export_ready: "&aYour data is ready to download until {until}. Whoever has the link can open it, so keep it to yourself:"
  export_ready_for: "&aA link to what Allay keeps about {player}, good until {until}. It's personal data: give it to them alone:"
  export_button: "&9[Download]"
  export_hover: "&7Opens the download in your browser"
  export_unsupported: "&7This Allay backend is older than 6.9 and can't make download links."
  erased: "&aErased what Allay kept about {player}: {memories} {memories|memory|memories}; {runs} {runs|question|questions} now count as nobody's."
  unknown_player: "&cThis server has never seen a player {player}. Use their UUID."
  unsupported: "&7This Allay backend is older than 6.0 and can't export or erase a player's data."
  usage: "&7Usage: &f/allay privacy &7[agree|withdraw|full|export|erase]; admins: &f/allay privacy export|erase <player|uuid>"
  full_on: "&aFull privacy is on: the admin panel of Allay's backend sees a pseudonym instead of your name, UUID, and skin. I still remember what you told me."
  full_off: "&7Full privacy is off: the admin panel sees your name again from your next question."
  full_is_on: "&7Full privacy: &aon&7. The admin panel sees a pseudonym instead of your name."
  full_is_off: "&7Full privacy: &coff&7. The admin panel sees your name. &f/allay privacy full on&7 hides it."
  full_unsupported: "&7Saved, but this Allay backend is older than 6.5 and still shows your name in its admin panel."
  window:
    title: "Your data"
    full_is_on: "&7Full privacy: &aon&7. The admin panel knows you by a pseudonym."
    full_is_off: "&7Full privacy: &coff&7. The admin panel shows your name."
    full_on: "Turn full privacy on"
    full_off: "Turn full privacy off"
