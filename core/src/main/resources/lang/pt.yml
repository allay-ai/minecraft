# A conversa e a memória. O assistente lembra as perguntas recentes por um dia, e fatos
# duradouros sobre o jogador (a base, as metas) até o jogador pedir para esquecer.
memory:
  session_cleared: "&aRecomeçando. O que eu lembro sobre você continua: &f/allay memory"
  header: "&6O que eu lembro sobre você:"
  line: "&e{n}. &f{text}"
  footer: "&7Para esquecer: &f/allay forget <número|all>"
  empty: "&7Ainda não lembro nada sobre você. Diga “lembre que…” e eu guardo."
  forgot: "&aEsqueci: &f{text}"
  forgot_all: "&aEsqueci tudo o que lembrava sobre você ({count})."
  forget_usage: "&7Uso: &f/allay forget <número|all>&7. Os números estão em &f/allay memory"
  not_found: "&cNão existe a anotação número {n}. A lista: &f/allay memory"
  unsupported: "&cEste servidor do Allay ainda não guarda memórias."
  remembered: "&aGuardei: &f{text}"
  noted: "&aAnotado no caderno: &f{text} &7({x} {y} {z}, {dimension})"
  full: "&cMinha memória está cheia. Me faça esquecer algo antes: &f/allay forget <número>"
  remember_usage: "&7Uso: &f/allay memory <o que lembrar>&7. Com coordenadas, vai para o caderno."

# Modo chat: o que o jogador escreve no chat vai para o Allay. ! executa comandos, ? pergunta na frente
# de todos, ~ escreve no chat normal. A dica aparece sob o segundo /ask de cada visita.
chat_mode:
  # Your own line in chat mode, marked like Allay's answers but without a name.
  own: "&3✦ &7{text}"
  enabled: "&a✔ Modo chat ligado. &7Agora tudo o que você escreve no chat vem para mim, não para os outros jogadores."
  prefix_askx: "&f  ! &7no começo executa comandos, como /askx"
  prefix_public: "&f  ? &7no começo pergunta para todos verem"
  prefix_chat: "&f  ~ &7no começo escreve no chat normal"
  how_to_off: "&7Para desligar: &f/allay chat off"
  disabled: "&7Modo chat desligado: o chat volta a ser de todos. Me pergunte com &f/ask&7."
  reminder: "&8※ O modo chat está ligado: escreva para mim direto no chat. &7~&8 no começo vai para o chat normal, &7/allay chat off&8 desliga."
  no_askx: "&cComandos com ! não estão disponíveis para você."
  no_askall: "&cVocê não pode perguntar na frente de todos."
  hints_off: "&7Beleza, não sugiro mais. O modo chat liga com &f/allay chat&7."
  hints_on: "&7A dica sobre o modo chat voltou."
  tip: "&8※ Você pode me escrever direto no chat, sem /ask."
  tip_enable: "&7[Modo chat]"
  tip_enable_hover: "&7Ligar o modo chat: tudo o que você escrever no chat vem para mim"
  tip_hide: "&8[Não mostrar mais]"
  tip_hide_hover: "&7Parar de sugerir o modo chat"

# Perguntas na frente de todos (/askall, ? no modo chat): todos os jogadores online leem a pergunta e a resposta.
public:
  question: "&3✦ &b{player} &7pergunta ao Allay:&f {text}"
  answer: "&3✦ &bAllay &8»&r {text}"
  failed: "&8✦ O Allay não conseguiu responder desta vez."
  cooldown: "&7Você pode perguntar a todos de novo em {seconds} {seconds|segundo|segundos}."
  vanished: "&7Você está invisível, então esta pergunta fica entre você e o Allay."

