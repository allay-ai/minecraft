privacy:
  info: "&6O que o Allay guarda sobre você neste servidor\n&7• Criptografado, no backend do Allay: a conversa de vocês, por 30 dias depois da sua última pergunta; o que ele lembra sobre você (&f/allay memory&7), lugares incluídos, e suas configurações, fuso horário, metas e mortes, até você apagar ou um ano depois da sua última pergunta; os registros das suas perguntas, por 30 dias, para encontrar e corrigir erros. Quem opera o backend só abre um registro para investigar um problema, e cada consulta fica registrada.\n&7• Sem criptografia: seu nome, UUID e status de operador para o painel de administração (a menos que você ative a privacidade total), os números das suas perguntas (quando, o modelo, o custo) e seu consentimento, por 2 anos.\n&7• Backups criptografados de tudo isso, por até 12 meses.\n&7• Cada pergunta passa pelo OpenRouter nos EUA até o provedor de IA que escreve a resposta.\n&7Outros servidores nunca veem nada disso."
  commands: "&f/allay privacy full on|off &7– privacidade total: o painel de administração vê um pseudônimo no lugar do seu nome\n&f/allay privacy export &7– um link para tudo o que o Allay guarda sobre você, por 24 horas\n&f/allay privacy withdraw &7– retirar seu consentimento; o Allay para de te responder\n&f/allay privacy erase &7– apagar tudo o que o Allay guarda sobre você aqui"
  admin: "&8Para admins: &f/allay privacy export <jogador> &8gera um link para os dados de um jogador entregar a ele, &f/allay privacy erase <jogador> &8apaga."
  erase_confirm: "&eApagar tudo o que o Allay guarda sobre você neste servidor? A memória, a conversa e as linhas dos seus agentes somem para sempre; suas perguntas ficam só como números anônimos."
  erase_hover: "&7Não dá para desfazer"
  erased_self: "&aPronto: o Allay esqueceu você neste servidor, com {memories} {memories|fato|fatos}."
  export_ready: "&aVocê pode baixar seus dados até {until}. Quem tiver o link consegue abrir, então não compartilhe:"
  export_ready_for: "&aUm link para o que o Allay guarda sobre {player}, válido até {until}. São dados pessoais: entregue só a essa pessoa:"
  export_button: "&9[Baixar]"
  export_hover: "&7Abre o download no navegador"
  export_unsupported: "&7Este backend do Allay é anterior ao 6.9 e não consegue criar links de download."
  erased: "&aApagado o que o Allay guardava sobre {player}: {memories} {memories|fato|fatos}; {runs} {runs|pergunta|perguntas} agora não são de ninguém."
  unknown_player: "&cEste servidor nunca viu um jogador {player}. Use o UUID dele."
  unsupported: "&7Este backend do Allay é anterior ao 6.0 e não consegue exportar nem apagar os dados de um jogador."
  usage: "&7Uso: &f/allay privacy &7[agree|withdraw|full|export|erase]; admins: &f/allay privacy export|erase <jogador|uuid>"
  full_on: "&aPrivacidade total ligada: o painel de administração do backend do Allay vê um pseudônimo no lugar do seu nome, UUID e skin. Continuo lembrando do que você me contou."
  full_off: "&7Privacidade total desligada: a partir da sua próxima pergunta o painel de administração volta a ver seu nome."
  full_is_on: "&7Privacidade total: &aligada&7. O painel de administração vê um pseudônimo no lugar do seu nome."
  full_is_off: "&7Privacidade total: &cdesligada&7. O painel de administração vê seu nome. &f/allay privacy full on&7 esconde."
  full_unsupported: "&7Salvo, mas este backend do Allay é anterior ao 6.5 e ainda mostra seu nome no painel de administração."
  window:
    title: "Seus dados"
    full_is_on: "&7Privacidade total: &aligada&7. O painel de administração vê um pseudônimo."
    full_is_off: "&7Privacidade total: &cdesligada&7. O painel de administração vê seu nome."
    full_on: "Ligar a privacidade total"
    full_off: "Desligar a privacidade total"
    full_hover: "&7O painel de administração do backend vê um pseudônimo em vez do seu nome, UUID e skin; o Allay lembra de tudo como antes"
    export: "Baixar meus dados"
    export_hover: "&7Um link no chat, válido por 24 horas"
    withdraw: "Retirar meu consentimento"
    withdraw_hover: "&7O Allay para de responder e apaga o que o consentimento cobria"
    withdraw_title: "Retirar o consentimento?"
    withdraw_about: "O Allay para de responder, seus agentes param, e memórias, lugares, mortes, configurações e a conversa são apagados. Você pode concordar de novo na próxima pergunta."
    withdraw_yes: "&cRetirar"
    erase: "Apagar tudo"
    erase_title: "Apagar tudo?"
    erase_yes: "&cApagar tudo"

consent:
  notice: "&6Antes de o Allay responder\n&7O Allay é um assistente de IA. Para responder, ele envia ao backend sua pergunta, seu nome e UUID, seu idioma e o que lê no jogo para você (inventário, arredores, coordenadas)."
  hosted: "&7Quem administra {server} responde pelo Allay nele; o allay.chat administra o backend do Allay para essa pessoa, em servidores em Helsinque (Finlândia), sob o RGPD e a LOPDGDD espanhola, com backups criptografados na Cloudflare. Cada pergunta passa pelo OpenRouter nos EUA até o provedor de IA que escreve a resposta."
  self: "&7Quem administra {server} tem o próprio backend do Allay e guarda seus dados. Cada pergunta vai para o provedor de IA que o servidor escolheu."
  keeps: "&7Guardado criptografado: a conversa por 30 dias, a memória, os lugares, as mortes, as configurações e as metas até um ano depois da sua última pergunta, os registros de perguntas por 30 dias. Guardado como está: seu nome, UUID, seu consentimento e os números das suas perguntas, por 2 anos. Backups por até 12 meses. As respostas vêm de uma IA e podem estar erradas. &f/allay privacy&7 mostra, exporta e apaga; &f/allay privacy withdraw&7 retira seu consentimento e apaga o que ele cobria."
  title: "O Allay e seus dados"
  agree: "&aConcordo"
  agree_hover: "&7O Allay responde sua pergunta na hora"
  decline: "&cNão"
  decline_hover: "&7O Allay não vai te responder nem enviar nada sobre você"
  policy: "Política de privacidade"
  policy_hover: "&7{url}"
  given: "&aValeu! O Allay já está respondendo."
  given_idle: "&aValeu! Pergunte com &f/ask&a."
  already: "&7Você já concordou. &f/allay privacy&7 mostra o que o Allay guarda sobre você."
  reopen: "&7Antes de responder, o Allay pergunta numa janela."
  reopen_button: "&f[Abrir de novo]"
  reopen_hover: "&7Abre a janela outra vez"
  declined: "&7Tudo bem: o Allay não vai te responder, e nada sobre você vai para o backend dele. Mudou de ideia? &f/allay privacy agree"
  withdrawn: "&7Você retirou seu consentimento: o Allay apagou o que ele cobria (memória, lugares, mortes, configurações, a conversa) e não vai te responder até você concordar de novo. &f/allay privacy erase&7 apaga o resto."
  not_given: "&7Você não deu consentimento, então não há nada para retirar."
  changed: "&6O aviso de privacidade do Allay mudou desde que você concordou em {date}."
  changed_undated: "&6O aviso de privacidade do Allay mudou desde a última vez que você concordou."
  changed_summary: "&7O que mudou: seus lugares, configurações, metas e mortes ficam no backend do Allay, criptografados, e não neste servidor; a conversa fica 30 dias; cada pergunta passa pelo OpenRouter nos EUA; jogadores da UE e dos EUA informam a idade; retirar o consentimento apaga o que ele cobria; você pode baixar seus dados por um link. Leia de novo e diga se concorda."
  age_question: "Quantos anos você tem?"
  age_under: "&7Obrigado por avisar. Aqui o Allay não pode responder a jogadores da sua idade, então não envia nada sobre você e guarda só que você respondeu, por um ano."
  age_why: "&7A lei (o RGPD na UE, a LOPDGDD na Espanha, a COPPA nos EUA) só deixa jogadores acima de certa idade, que depende do país, concordarem com o uso dos seus dados. Por isso o Allay precisa saber sua idade primeiro."
  age_under13: "Menos de 13"
  age_13: "13"
  age_14_15: "14–15"
  age_16_17: "16–17"
  age_18: "18 ou mais"
  age_hover: "&7O Allay guarda só se você tem idade para concordar"
  age_blocked: "&7O Allay ainda não pode te responder aqui: você disse que é jovem demais para concordar com o uso dos seus dados. Ele pergunta de novo um ano depois da sua resposta."
  server_named: "o servidor {name}"
  server_this: "este servidor"

