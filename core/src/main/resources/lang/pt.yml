# Textos do Allay em português do Brasil. Cada jogador lê o arquivo do seu idioma; uma
# chave que falta aqui vem de locales.default e depois do inglês. Um texto vazio ("")
# desliga a mensagem. As cores usam códigos & (&a, &7, &f…). Substituições são como {name};
# plurais são como {count|pilha|pilhas}: a forma depende do número em {count}.
# Com o PlaceholderAPI, {papi:name} mostra %name% do jogador de quem a mensagem fala.

status:
  # A linha viva na barra de ação enquanto o assistente trabalha, como no Claude Code:
  # spinner, um verbo que muda, segundos, tokens lidos (↑) e escritos (↓).
  line: "&6{spinner} &6{verb}… &7({seconds}s · ↑ {input} · ↓ {output} {tokens|token|tokens})"
  # Enquanto há um rastro: uma seta que gira com a sua visão e os blocos que faltam.
  trail: "&b{arrow} &f{blocks} &7{blocks|bloco|blocos}"
  trail_to: "&b{arrow} &f{name} &7{blocks} {blocks|bloco|blocos}"
  trail_hidden: "&7{name} saiu da sua barra localizadora"
  answering: "Escrevendo a resposta"
  verbs:
    - "Folheando o livro de receitas"
    - "Fundindo ideias na fornalha"
    - "Encantando a resposta"
    - "Preparando uma poção de sabedoria"
    - "Perguntando ao bibliotecário"
    - "Conferindo o mapa"
    - "Puxando redstone"
    - "Cantarolando uma melodia"
    - "Rodeando o bloco musical"
    - "Afiando a picareta"
    - "Cavando no Y −59"
    - "Procurando algo brilhante"
    - "Revirando os baús"
    - "Sobrevoando os baús"
    - "Trazendo o item certo"
    - "Passando de fininho pelo Defensor"
    - "Discutindo com um creeper"
    - "Dançando ao som da jukebox"
  askx_verbs:
    - "Configurando um bloco de comando"
    - "Escolhendo o seletor @s"
    - "Conferindo a sintaxe"
    - "Girando o comparador"

tool_lines:
  # Uma linha no chat quando o assistente usa uma ferramenta, e o resultado embaixo.
  started: "&7⏺ {label}"
  finished: "&8  ⎿ {summary}"
  refused: "&c  ⎿ {summary}"
  # O motivo ({reason}) é escrito para o assistente, em inglês, por isso não aparece aqui.
  failed: "&c  ⎿ não deu"
  unknown: "Usando {name}"
  # Another plugin's or mod's tool, by its name.
  expansion: "Consultando {name}"

