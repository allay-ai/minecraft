###############################################################################
#                            Allay configuration                              #
###############################################################################
# /ask asks Allay, an AI helper, about the game in private, /askall in front of
# everyone, /askx turns a request into commands. /allay chat sends whatever a player
# writes in chat to Allay. This file holds settings only: every text players read
# lives in lang/<language>.yml, and each player reads their own language. Every
# key here has a default, so you can delete the ones you don't change.
# /allay reload applies changes without a restart.

# The Allay backend that answers questions.
server:
  url: "https://allay.chat"
  # A backend you run yourself (SELFHOSTED=1) answers only plugins that send its
  # PLUGIN_TOKEN: put the same value here. Leave it empty for allay.chat, which knows
  # your server by its license. Allay never logs it.
  token: ""
  # Your server's name in the backend's admin panel, like "Moonlands": 2–32 letters, digits,
  # spaces, or . _ ' -. No two servers on a backend share one; a taken name shows as an
  # error in the log. Empty: the panel shows the server's random id.
  name: ""
  # Where players join, like "mc.example.com". The backend's admin panel shows it next to
  # your server, with the game port. Empty: the game's server-ip, if set.
  address: ""
  # A few lines about your server for Allay: what it is, its rules and places, your site
  # and map, and how you'd like Allay to talk with players. Allay uses it to answer
  # questions; its own rules still come first. Every question sends it to the model,
  # so keep it short: past 2,000 characters the log warns, and the backend reads at
  # most 10,000. English costs the fewest tokens; Allay answers in each player's language.
  about: ""
  # about: |
  #   Moonlands is a hard survival server for friends. Claims with a golden shovel,
  #   two at most. The map: https://example.com/map/

# Who pays for the AI model. Two ways:
#   hosted: the backend's key and models, paid with a subscription in Telegram Stars.
#     /allay link gives you the payment link and keeps the license in
#     license.key next to this file; /allay status shows how it stands.
#   byok: your own key for any OpenAI-compatible API (OpenRouter by default).
#     allay.chat still wants a license as your server's identity; Allay gets one
#     by itself, free, and keeps it in license.key. It pays for nothing.
# A backend you run yourself with SELFHOSTED=1 needs neither: it serves you on its
# own key, with server.token above. Neither the key nor the license ever goes to the log.
provider:
  mode: hosted
  byok:
    base_url: "https://openrouter.ai/api/v1"   # Any OpenAI-compatible API
    api_key: ""
    model: ""                # Empty: the backend's default. It must be able to call tools
    search_model: ""         # Empty: no web search; on OpenRouter, e.g. "perplexity/sonar"

locales:
  # Players nothing else matches, and the console, get this language.
  default: en
  # Where a player's language comes from, tried in order:
  #   ip     — the country of their IP address, through the lists below;
  #   client — the language set in their game, when a lang/ file matches it.
  sources: [ ip, client ]
  # Language → the ISO 3166 country codes that get it. Add a lang/it.yml and an
  # “it: [ IT, SM, VA ]” line to add Italian. Players behind a proxy or relay show
  # up with its address, so they get the relay's country.
  countries:
    ru: [ RU, BY, KZ, KG, TJ, UZ, AM, AZ, MD, GE, TM ]
    es: [ ES, MX, AR, CO, CL, PE, VE, EC, GT, CU, BO, DO, HN, PY, SV, NI, CR, PA, UY, PR, GQ ]
    pt: [ BR, PT, AO, MZ, CV, GW, ST, TL ]
    de: [ DE, AT, CH, LI, LU ]

geoip:
  # The country database: DB-IP's free “IP to Country Lite”, CC BY 4.0, about 4 MB.
  # Allay downloads it into geoip/ and refreshes it once it's older than
  # refresh_days. Lookups happen on your server; no address leaves it. The country
  # also sets how old a player must be to agree to Allay's notice (13 to 16 in the
  # EU, 14 in Spain, 13 in the US; 16 when unknown). With allay.chat the lookup runs
  # even with enabled: false.
  enabled: true
  url: "https://download.db-ip.com/free/dbip-country-lite-{year}-{month}.mmdb.gz"
  refresh_days: 30

# The HTTP client that talks to the backend. Times are in seconds.
http:
  call_timeout: 300         # The whole question, from asking to the last word of the answer
  connect_timeout: 10
  read_timeout: 300
  write_timeout: 10
  tool_timeout: 10          # How long a game tool may run before the assistant gets an error
  max_idle_connections: 5
  keep_alive_duration: 300
  max_requests_per_host: 5
  follow_redirects: true
  retry_on_connection_failure: true
  logging: false            # Log each request's method, URL, and status (never the body)
  compression_enabled: true
  # Extra headers for every request. An X-OpenRouter-Token here from before 5.0 still
  # works as your own OpenRouter key; provider.byok above is the new place for it.
  custom_headers: {}
  #  "X-OpenRouter-Token": "sk-or-v1-…"

ui:
  # The live status in the action bar while the assistant works, like Claude Code:
  # a spinner, a changing verb, seconds, and tokens read and written. Its text and
  # verbs live in lang/ under status.
  action_bar:
    enabled: true
    spinner: "·✢✳✶✻✽"         # Spinner frames; it runs through them and back
    frame_millis: 120         # How long one frame shows
    verb_seconds: 3           # How often the verb changes
  # A chat line for each tool the assistant uses, with its result under it.
  tool_lines:
    enabled: true
  particles:
    enabled: true             # Particles over the player's head while the assistant works
    type: "ENCHANT"
    count: 3
    height_offset: 2.0
    animation_interval: 250   # Milliseconds between bursts
  chat_status:
    enabled: false            # Also say “asking the assistant…” in chat
  # The author of the books the assistant writes when a player asks for detail.
  book_author: "Allay"
  # Allay sounds like an allay. The game plays these quietly on its own, so a volume
  # of 1.0 is as loud as the mob. Any of the game's sounds works here, by its Bukkit
  # name (ENTITY_ALLAY_ITEM_GIVEN) or its id (entity.allay.item_given).
  sounds:
    enabled: true
    success_sound: "ENTITY_ALLAY_ITEM_GIVEN"            # The answer is in: the allay chortles
    success_volume: 1.0
    success_pitch: 1.0
    error_sound: "ENTITY_ALLAY_AMBIENT_WITHOUT_ITEM"    # Something went wrong: the allay yearns
    error_volume: 1.0
    error_pitch: 0.9
    thinking_sound: "ENTITY_ALLAY_AMBIENT_WITH_ITEM"    # Allay starts working: the allay seeks
    thinking_volume: 1.0
    thinking_pitch: 1.0
    pitch_variation: 0.1      # Each sound's pitch moves up or down by up to this, so answers don't all sound the same
    public_answer: true       # Everyone who reads an answer to /askall hears a quiet chortle too

# Game tools: the assistant asks the plugin about the game when it needs to. Every
# tool knows only the player who asked and the world around them; other players show
# up only as a count. A switched-off tool is never offered to the assistant.
tools:
  enabled:
    get_player_status: true       # Health, food, XP, coordinates, biome, effects, the item in hand
    get_inventory: true           # Inventory, armor, offhand, and on request the ender chest; what bundles and shulker boxes hold
    get_surroundings: true        # Blocks and creatures around: ores, chests, spawners, mobs
    look_at: true                 # Whatever is under the crosshair: a block and its drops, a container's contents, an enchanting table, a mob and the hits to kill it, a villager's trades
    get_world: true               # Time, day, moon, weather, difficulty, the game rules that matter
    get_statistics: true          # Play time, deaths, kills, distances
    get_advancements: true        # Advancements done and to go
    get_recipes: true             # This server's recipes: crafting, cooking, and brewing, mods', data packs', and plugins' too
    search_items: true            # Find an item or potion by its name in any language or by id, with where it comes from and how it's made
    locate_structure: true        # The nearest village, stronghold, and so on (the search loads the server)
    locate_biome: true            # The nearest biome of a kind (the search loads the server)
    get_server: true              # Server version, players online, the plugins or mods with their versions, and the data packs
    search_commands: true         # The server's commands this player may run, with the plugin or mod each comes from and its usage
    get_locations: true           # Respawn point, world spawn, and the last death
    get_nearby_players: true      # Other players as the asker's locator bar shows them: name, distance, direction
    get_death_info: true          # Where the player last died, what dropped, and how long it will lie there; Allay's backend keeps earlier deaths
    find_villagers: true          # Villagers around and their trades; can look for one item
    scan_nearby_containers: true  # Containers around and what's in them (only those the player could open: outside claims, or with GriefPrevention's container trust)
    find_item: true               # Where an item is: inventory, ender chest, containers around, inside shulker boxes and bundles (the same containers)
    inspect_item: true            # One item in full: damage and speed, potions, trims, books, maps, what a shulker box or bundle holds
    get_item_durability: true     # Wear on tools and armor, what needs repair
    get_xp_info: true             # Level, points, how far to a level
    get_food_options: true        # Food in the inventory: hunger, saturation, side effects
    get_anvil_plan: true          # The cheapest order of books on the anvil for an item in hand or in the inventory
    inspect_redstone: true        # A machine's parts and the faults the game's rules make certain; only where the player may build
    get_brewing_items: true       # Everything for brewing in the inventory and brewing stands nearby
    get_brewing_recipe: true      # How to brew a potion, step by step, from the game's own recipes
    # How the answer reaches the player
    add_buttons: true             # Buttons in the answer: next question, the way, a note, windows, a command, a line to send
    write_book: true              # A long answer as a book when the player asks for detail; the book is free to take
    set_timezone: true            # The player's time zone, so the assistant knows their real time
    # Allay about itself
    get_allay_guide: true         # The commands, chat mode prefixes, and settings this player has, so the assistant can explain them
    allay_settings: true          # Chat mode and its tip on or off when the player asks in words
    # Goals with a bar at the top of the screen
    goals: true                   # Set, list, and cancel goals: “collect 16 diamonds”, “reach level 30”
    # Harmless actions: they give nothing and change nothing in the world
    point_to: true                # Point the compass at a spot or a player on the locator bar and draw a trail there (only the asker sees it)
    show_marks: true              # Glowing boxes, ghost blocks, and labels over blocks that only the asker sees: their chests, where to put torches
    show_draft: false             # Experimental, off by default: a build of up to 20×15×20 as glowing ghosts, layer by layer; costs many tokens and often comes out wrong
    sort_inventory: true          # Merge stacks and sort the inventory; the hotbar and offhand only when asked, with pinned slots (“sword first”)
    reminders: true               # Remind the player in 1–120 minutes; list and cancel reminders
    ping_me: true                 # A sound and particles over the player, seen and heard by everyone nearby
    # Automation agents (see automation below): the chat starts and steers them, each agent uses the rest
    start_task: true              # Hand a job to an automation agent that works in the background
    message_task: true            # Pass the player's answer on to a running agent
    cancel_task: true             # Stop a running agent
    say: true                     # An agent's line to its player, with buttons
    wait: true                    # An agent sleeps until the player answers, its job ends, or a time passes
    finish: true                  # An agent's last line
    pick_blocks: true             # The player picks chests, furnaces, or brewing stands with left clicks
    chests: true                  # Sort, group, and move items between chests, with a preview and undo
    smelt: true                   # Load furnaces evenly with exactly the fuel needed
    brew: true                    # Brew a potion in brewing stands, step by step
    craft: true                   # Craft from what the player has around: 2×2 by hand, a table, a stonecutter, a smithing table
    anvil: true                   # Put books on an item and rename it on an anvil, for the player's levels
    grindstone: true              # Take enchantments off an item, or join two worn ones, on a grindstone
  # Tools that change the game for the asker: items, teleports, and the like. The
  # assistant gets them only when the player is an operator, and the plugin checks
  # again before running one. A regular player can't talk it into a sword.
  operator:
    enabled: true             # false: the assistant changes nothing, even for operators
    give_item: true           # Give an item (up to 576, with enchantments)
    teleport: true            # Teleport to a spot or to a player online
    set_gamemode: true
    heal: true                # Restore health and food, put out fire
    apply_effect: true        # Apply an effect (up to an hour, level up to 10) or clear them all
    set_time: true
    set_weather: true
  # Reminders live in memory: a restart or the player leaving drops them.
  reminders:
    max_pending: 10           # Reminders one player can have waiting
  goals:
    max_per_player: 5         # Goals one player can have at once
  # The trail point_to and the way buttons draw. It ends early once the player arrives,
  # and /allay cancel stops it.
  point_to:
    default_seconds: 30       # When the assistant names no length, and for way buttons
    follow_seconds: 180       # The same for a trail to another player, which follows them as they move
    max_seconds: 600          # The longest trail the assistant may draw (10–3600)
    action_bar: true          # An arrow toward the spot and the blocks left in the action bar; an answer's status comes first
  # Marks over blocks: they glow through walls, but never on ores, spawners, or vaults, and only on
  # containers the player could open (outside claims, or with container trust in GriefPrevention).
  # They go out after their time, on /allay cancel, or when the player places a block on a ghost.
  show_marks:
    default_seconds: 30       # When the assistant names no length
    max_seconds: 600          # The longest the assistant may keep them (10–3600)
    max_marks: 64             # Marks at once (1–64)
    radius: 48                # How far from the player a mark may be, in blocks (8–128)
  # The biome search radius in blocks (64–6400); it runs on the main thread, like /locate biome.
  locate_biome_radius: 2048
  # How far to look for villagers, in blocks (8–64).
  villager_radius: 32
  # The structure search radius in chunks; it runs on the main thread, so keep it small.
  locate_structure_radius: 64
  server:
    # Plugins or mods get_server and search_commands leave out, by name or id, such as an anti-cheat.
    hidden_plugins: []

# Other plugins and mods can add tools, items, recipes, and a few lines of advice for the
# assistant through Allay's expansion API (see the wiki's “Expansions”). Their tools follow
# the same rules as Allay's: operator ones only for operators, none for automation agents,
# and nothing before a player agrees to the notice.
expansions:
  enabled: true               # false: Allay takes no expansions at all
  disabled: []                # Expansions to leave out, by id, like mana

# Finding items by name: the assistant looks things up on this server instead of trusting
# its memory, mods', data packs', and plugins' things included. The game's names in English
# ship with the server; the other languages download once per game version from Mojang,
# as the game's launcher fetches them, into cache/lang/.
catalog:
  download: true              # false: names in other languages only from mods, plugins, and expansions
  languages: [ru_ru, de_de, es_es, es_mx, pt_br, pt_pt]

# Automation agents: “sort these chests”, “smelt all my gold ore”, “brew night vision for
# me”, “craft me a set of tools”. The chat hands the job to an agent that works in the
# background, writes to the player under its name, and waits for answers or for the
# furnaces without costing anything. It works only near the player: it pauses while they're
# away and touches only what they could open themself (GriefPrevention's container trust).
# Chests take part only without a hopper on them and while nobody has them open. If someone
# takes what an agent counts on, it stops and says so. Permissions: allay.automation and
# allay.automation.chests, .furnaces, .brewing, .crafting (everyone by default).
automation:
  enabled: true               # false: no automation at all
  chests:
    enabled: true
    # “Sort all” reaches chests from the picked ones across gaps of up to this many blocks.
    # A higher number reaches more chests and takes longer to sort.
    gap: 6
    max: 64                   # Chests one agent may take at once (1–256)
    undo_minutes: 5           # How long “put it back” works, if nobody touched the chests since
  furnaces:
    enabled: true
  brewing:
    enabled: true
  crafting:
    enabled: true
  max_tasks: 2                # Agents one player may run at once, the agents they start included (1–8)
  max_minutes: 30             # An agent stops after this long
  max_wakes: 40               # Each wake is one request to the model; this bounds what an agent costs
  max_wait_seconds: 600       # The longest an agent may sleep before it looks again (10–3600; a wait is at least 10 s)
  radius: 32                  # How far furnaces, stands, crafting tables, and chests to take from may be (4–52)
  pause_distance: 64          # An agent pauses while its player is farther than this from where it started
  # A furnace, brewing stand, or crafting table counts only when no wall of opaque blocks
  # stands between it and the player's eyes; glass, leaves, and slabs don't hide it.
  line_of_sight: true

# Spending limits, whoever pays (your own key, a self-hosted backend, or the subscription).
# monthly_usd is what the whole server may spend a month. Tiers are weights, given by the
# permission allay.quota.<tier> (any name you like: vip, p10, p99); default needs none. A
# player gets the biggest weight they hold, operators the biggest there is. Nobody books
# money: a player's limit is the open budget times their weight over the weights of
# everyone who asked this month. A VIP (3) alone may use it all; next to a regular player
# (1) it's 75% and 25%. A weight that isn't a number above 0 makes Allay answer nobody and
# tell admins why.
quota:
  enabled: false
  monthly_usd: 20.0
  daily: true                 # Open the budget day by day, so the first evening can't spend the month
  tiers:
    default: 1
  #  vip: 3

# A model per tier of players: allay.model.<tier> picks it, the first tier in this list
# the player has; operators get the first. With your own key (provider.mode byok) it
# replaces provider.byok.model; a self-hosted backend (SELFHOSTED=1) honors it too.
models: {}
#  vip: "anthropic/claude-sonnet-5.5"

# Before a player's first question Allay shows what it does with their data and asks
# them to agree, in a window with buttons; until they do, nothing about them reaches the
# backend. The backend keeps the answer (Allay Server 6.1 and newer; an older one
# can't, and Allay asks nobody). /allay privacy withdraw takes it back.
# consent: false skips the notice, but only with a backend of your own (server.token);
# with allay.chat every player is asked.
privacy:
  consent: true
  # The page the question links to. Empty: allay.chat's privacy policy, or no link
  # with server.token (a backend you run yourself; put your own page here).
  policy_url: ""

# Questions everyone sees: /askall, or ? in chat mode. The question and the answer
# go to every player online.
askall:
  # How long a player waits between two of them; allay.askall.nocooldown skips it.
  cooldown_seconds: 30

# Players' real time. The assistant sees each player's date and time with every question.
# The game doesn't say where a player is, so everyone starts in this zone; a player can
# name theirs and the assistant remembers it.
time:
  zone: "Europe/Moscow"       # An IANA time zone, such as Europe/Berlin or America/New_York

# Commands /askx may never run, whatever the request. Who may use the commands is up to
# permissions: allay.ask, allay.askall, allay.chat, and allay.automation (everyone by default),
# allay.askx, allay.askall.nocooldown, and allay.reload (operators).
blocked_commands:
  - "ban"
  - "config"
  - "configure"
  - "deop"
  - "kick"
  - "op"
  - "pardon"
  - "pl"
  - "plugin"
  - "plugins"
  - "reload"
  - "restart"
  - "save-all"
  - "save-off"
  - "save-on"
  - "stop"
  - "whitelist"
