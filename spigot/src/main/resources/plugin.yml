name: Allay
version: '${version}'
description: 'An AI helper in chat, named after the friendly mob: ask about the game with /ask or right in chat mode, with answers grounded in your inventory, surroundings, and this server, in each player''s language.'
main: chat.allay.spigot.Zygote
api-version: '26.3'
author: MairwunNx
website: https://github.com/allay-ai/minecraft
prefix: Allay
load: STARTUP
softdepend: [PlaceholderAPI, Plan, GriefPrevention]

commands:
  ask:
    description: Ask Allay a private question
    usage: /<command> <question>
    permission: allay.ask
  askall:
    description: Ask Allay a question everyone online sees, with the answer
    usage: /<command> <question>
    permission: allay.askall
  askx:
    description: Turn a request into Minecraft commands
    usage: /<command> <what to do>
    permission: allay.askx
  allay:
    description: Allay's chat mode, memory, windows, and settings
    usage: /<command> chat|hints [on|off] | cancel | new | memory | forget <number|all> | recipe <item> | enchants | villagers | reload | status | link | locale [player]

permissions:
  allay.ask:
    description: Ask private questions with /ask, and use /allay's memory, windows, and cancel
    default: true
  allay.askall:
    description: Ask questions everyone sees with /askall, or ? in chat mode
    default: true
  allay.askall.nocooldown:
    description: Ask everyone without waiting for askall.cooldown_seconds
    default: op
  allay.chat:
    description: Use chat mode and its tip (/allay chat, /allay hints)
    default: true
  allay.askx:
    description: Run commands with /askx, or ! in chat mode
    default: op
  allay.reload:
    description: Reload settings and languages with /allay reload
    default: op
  allay.admin:
    description: See and pay for Allay's model with /allay status and /allay link, and see why a player got their language with /allay locale; hear about the subscription
    default: op
  allay.automation:
    description: Start automation agents that sort chests, smelt, brew, and craft near the base; each kind also needs its own permission
    default: true
  allay.automation.chests:
    description: Automation agents that sort, group, and move items between chests
    default: true
  allay.automation.furnaces:
    description: Automation agents that load furnaces, blast furnaces, and smokers
    default: true
  allay.automation.brewing:
    description: Automation agents that brew potions in brewing stands
    default: true
  allay.automation.crafting:
    description: Automation agents that craft at a crafting table
    default: true
