###############################################################################
#                            Allay configuration                              #
###############################################################################
# /ask asks Allay, an AI helper, about the game in private, /askall in front of
# everyone, /askx turns a request into commands. /allay chat sends whatever a player
# writes in chat to Allay. This file holds settings only: every text players read
# lives in lang/<language>.yml, and each player reads their own language. Every
# key here has a default, so you can delete the ones you don't change.
# /allay reload applies changes without a restart.

# The Allay backend that answers questions.
server:
  url: "https://allay.chat"

# Who pays for the AI model. Two ways:
#   hosted: the backend's key and models, paid with a subscription in Telegram Stars.
#     /allay link gives you the payment link and keeps the license in
#     license.key next to this file; /allay status shows how it stands.
#   byok: your own key for any OpenAI-compatible API (OpenRouter by default).
# A backend you run yourself with SELFHOSTED=1 needs neither: it serves you on its
# own key. Neither the key nor the license ever goes to the log.
provider:
  mode: hosted
  byok:
    base_url: "https://openrouter.ai/api/v1"   # Any OpenAI-compatible API
    api_key: ""
    model: ""                # Empty: the backend's default. It must be able to call tools
    search_model: ""         # Empty: no web search; on OpenRouter, e.g. "perplexity/sonar"

locales:
  # Players nothing else matches, and the console, get this language.
  default: en
  # Where a player's language comes from, tried in order:
  #   ip     — the country of their IP address, through the lists below;
  #   client — the language set in their game, when a lang/ file matches it.
  sources: [ ip, client ]
  # Language → the ISO 3166 country codes that get it. Add a lang/it.yml and an
  # “it: [ IT, SM, VA ]” line to add Italian. Players behind a proxy or relay show
  # up with its address, so they get the relay's country.
  countries:
    ru: [ RU, BY, KZ, KG, TJ, UZ, AM, AZ, MD, GE, TM ]
    es: [ ES, MX, AR, CO, CL, PE, VE, EC, GT, CU, BO, DO, HN, PY, SV, NI, CR, PA, UY, PR, GQ ]
    pt: [ BR, PT, AO, MZ, CV, GW, ST, TL ]
    de: [ DE, AT, CH, LI, LU ]

geoip:
  # The country database: DB-IP's free “IP to Country Lite”, CC BY 4.0, about 4 MB.
  # The plugin downloads it into geoip/ and refreshes it once it's older than
  # refresh_days. Lookups happen on your server; no address leaves it.
  enabled: true
  url: "https://download.db-ip.com/free/dbip-country-lite-{year}-{month}.mmdb.gz"
  refresh_days: 30

# The HTTP client that talks to the backend. Times are in seconds.
http:
  call_timeout: 300         # The whole question, from asking to the last word of the answer
  connect_timeout: 10
  read_timeout: 300
  write_timeout: 10
  tool_timeout: 10          # How long a game tool may run before the assistant gets an error
  max_idle_connections: 5
  keep_alive_duration: 300
  max_requests_per_host: 5
  follow_redirects: true
  retry_on_connection_failure: true
  logging: false            # Log each request's method, URL, and status (never the body)
  compression_enabled: true
  # Extra headers for every request. An X-OpenRouter-Token here from before 5.0 still
  # works as your own OpenRouter key; provider.byok above is the new place for it.
  custom_headers: {}
  #  "X-OpenRouter-Token": "sk-or-v1-…"

ui:
  # The live status in the action bar while the assistant works, like Claude Code:
  # a spinner, a changing verb, seconds, and tokens read and written. Its text and
  # verbs live in lang/ under status.
  action_bar:
    enabled: true
    spinner: "·✢✳✶✻✽"         # Spinner frames; it runs through them and back
    frame_millis: 120         # How long one frame shows
    verb_seconds: 3           # How often the verb changes
  # A chat line for each tool the assistant uses, with its result under it.
  tool_lines:
    enabled: true
  particles:
    enabled: true             # Particles over the player's head while the assistant works
    type: "ENCHANT"
    count: 3
    height_offset: 2.0
    animation_interval: 250   # Milliseconds between bursts
  chat_status:
    enabled: false            # Also say “asking the assistant…” in chat
  # The author of the books the assistant writes when a player asks for detail.
  book_author: "Allay"
  # Allay sounds like an allay. The game plays these quietly on its own, so a volume
  # of 1.0 is as loud as the mob. Any of Bukkit's sound names works here.
  sounds:
    enabled: true
    success_sound: "ENTITY_ALLAY_ITEM_GIVEN"            # The answer is in: the allay chortles
    success_volume: 1.0
    success_pitch: 1.0
    error_sound: "ENTITY_ALLAY_AMBIENT_WITHOUT_ITEM"    # Something went wrong: the allay yearns
    error_volume: 1.0
    error_pitch: 0.9
    thinking_sound: "ENTITY_ALLAY_AMBIENT_WITH_ITEM"    # Allay starts working: the allay seeks
    thinking_volume: 1.0
    thinking_pitch: 1.0
    pitch_variation: 0.1      # Each sound's pitch moves up or down by up to this, so answers don't all sound the same
    public_answer: true       # Everyone who reads an answer to /askall hears a quiet chortle too

# Game tools: the assistant asks the plugin about the game when it needs to. Every
# tool knows only the player who asked and the world around them; other players show
# up only as a count. A switched-off tool is never offered to the assistant.
tools:
  enabled:
    get_player_status: true       # Health, food, XP, coordinates, biome, effects, the item in hand
    get_inventory: true           # Inventory, armor, offhand, and on request the ender chest; what bundles and shulker boxes hold
    get_surroundings: true        # Blocks and creatures around: ores, chests, spawners, mobs
    look_at: true                 # Whatever is under the crosshair: a block and its drops, a container's contents, an enchanting table, a mob and the hits to kill it, a villager's trades
    get_world: true               # Time, day, moon, weather, difficulty, the game rules that matter
    get_statistics: true          # Play time, deaths, kills, distances
    get_advancements: true        # Advancements done and to go
    get_recipes: true             # This server's recipes
    locate_structure: true        # The nearest village, stronghold, and so on (the search loads the server)
    locate_biome: true            # The nearest biome of a kind (the search loads the server)
    get_server: true              # Server version, players online, and the plugins with their versions
    get_locations: true           # Respawn point, world spawn, and the last death
    get_nearby_players: true      # Other players as the asker's locator bar shows them: name, distance, direction
    get_death_info: true          # Where the player died, what dropped, and how long it will lie there
    find_villagers: true          # Villagers around and their trades; can look for one item
    scan_nearby_containers: true  # Containers around and what's in them (only those the player could open: outside claims, or with GriefPrevention's container trust)
    find_item: true               # Where an item is: inventory, ender chest, containers around, inside shulker boxes and bundles (the same containers)
    inspect_item: true            # One item in full: damage and speed, potions, trims, books, maps, what a shulker box or bundle holds
    get_item_durability: true     # Wear on tools and armor, what needs repair
    get_xp_info: true             # Level, points, how far to a level
    get_food_options: true        # Food in the inventory: hunger, saturation, side effects
    get_anvil_plan: true          # The cheapest order of books on the anvil for the item in hand
    get_light_spawn_check: true   # Dark spots around where hostile mobs can spawn
    inspect_redstone: true        # A machine's parts and the faults the game's rules make certain; only where the player may build
    get_brewing_items: true       # Everything for brewing in the inventory and brewing stands nearby
    get_brewing_recipe: true      # How to brew a potion, step by step, from the game's own recipes
    scan_farm: true               # The farm around: crops by stage, farmland, animals, spawners
    # How the answer reaches the player
    add_buttons: true             # Buttons under the answer: next question, the way, a note, a recipe, enchantments, villagers
    write_book: true              # A long answer as a book when the player asks for detail; the book is free to take
    set_timezone: true            # The player's time zone, so the assistant knows their real time
    # Allay about itself
    get_allay_guide: true         # The commands, chat mode prefixes, and settings this player has, so the assistant can explain them
    allay_settings: true          # Chat mode and its tip on or off when the player asks in words
    # Goals with a bar at the top of the screen, kept in plugins/Allay/goals
    goals: true                   # Set, list, and cancel goals: “collect 16 diamonds”, “reach level 30”
    # The player's notebook: notes with coordinates, kept in plugins/Allay/notes
    add_note: true                # Write a note (by default where the player stands)
    find_notes: true              # Find notes, nearest first
    delete_note: true             # Delete a note
    # Harmless actions: they give nothing and change nothing in the world
    point_to: true                # Point the compass at a spot or a player on the locator bar and draw a trail there (only the asker sees it)
    show_marks: true              # Glowing boxes, ghost blocks, and labels over blocks that only the asker sees: their chests, where to put torches
    show_draft: true              # A build of up to 20×15×20 as glowing ghosts, layer by layer, checked against what the player places
    sort_inventory: true          # Merge stacks and sort the inventory (the hotbar stays)
    reminders: true               # Remind the player in 1–120 minutes; list and cancel reminders
    ping_me: true                 # A sound and particles over the player, seen and heard by everyone nearby
  # Tools that change the game for the asker: items, teleports, and the like. The
  # assistant gets them only when the player is an operator, and the plugin checks
  # again before running one. A regular player can't talk it into a sword.
  operator:
    enabled: true             # false: the assistant changes nothing, even for operators
    give_item: true           # Give an item (up to 576, with enchantments)
    teleport: true            # Teleport to a spot or to a player online
    set_gamemode: true
    heal: true                # Restore health and food, put out fire
    apply_effect: true        # Apply an effect (up to an hour, level up to 10) or clear them all
    set_time: true
    set_weather: true
  # Reminders live in memory: a restart or the player leaving drops them.
  reminders:
    max_pending: 10           # Reminders one player can have waiting
  notes:
    max_per_player: 200       # Notes in one player's notebook
  goals:
    max_per_player: 5         # Goals one player can have at once
  # The trail point_to and the way buttons draw. It ends early once the player arrives,
  # and /allay cancel stops it.
  point_to:
    default_seconds: 30       # When the assistant names no length, and for way buttons
    follow_seconds: 180       # The same for a trail to another player, which follows them as they move
    max_seconds: 600          # The longest trail the assistant may draw (10–3600)
  # Marks over blocks: they glow through walls, but never on ores, spawners, or vaults, and only on
  # containers the player could open (outside claims, or with container trust in GriefPrevention).
  # They go out after their time, on /allay cancel, or when the player places a block on a ghost.
  show_marks:
    default_seconds: 120      # When the assistant names no length
    max_seconds: 600          # The longest the assistant may keep them (10–3600)
    max_marks: 64             # Marks at once (1–256)
    radius: 48                # How far from the player a mark may be, in blocks (8–128)
  # The biome search radius in blocks (64–6400); it runs on the main thread, like /locate biome.
  locate_biome_radius: 2048
  # How far to look for villagers, in blocks (8–64).
  villager_radius: 32
  # The structure search radius in chunks; it runs on the main thread, so keep it small.
  locate_structure_radius: 64
  server:
    # Plugins get_server leaves out of its list, by name, such as an anti-cheat.
    hidden_plugins: []

# Questions everyone sees: /askall, or ? in chat mode. The question and the answer
# go to every player online.
askall:
  # How long a player waits between two of them; allay.askall.nocooldown skips it.
  cooldown_seconds: 30

# Players' real time. The assistant sees each player's date and time with every question.
# The game doesn't say where a player is, so everyone starts in this zone; a player can
# name theirs and the assistant remembers it.
time:
  zone: "Europe/Moscow"       # An IANA time zone, such as Europe/Berlin or America/New_York

# Commands /askx may never run, whatever the request. Who may use the commands is up to
# permissions: allay.ask, allay.askall, and allay.chat (everyone by default),
# allay.askx, allay.askall.nocooldown, and allay.reload (operators).
blocked_commands:
  - "ban"
  - "config"
  - "configure"
  - "deop"
  - "kick"
  - "op"
  - "pardon"
  - "pl"
  - "plugin"
  - "plugins"
  - "reload"
  - "restart"
  - "save-all"
  - "save-off"
  - "save-on"
  - "stop"
  - "whitelist"
